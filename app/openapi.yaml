          description: Account deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  # ════════════════════════════════════════════════════════════════════
  # Provider Sources (admin): catalogs version 2, what is installed from them
  # ════════════════════════════════════════════════════════════════════

  /sources:
    get:
      operationId: listSources
      tags: [sources]
      summary: List the registered provider sources
      description: >
        A source is the URL of a catalog (version 2). The credential of a source is never
        returned: `has_credential` says whether there is one.
      responses:
        "200":
          description: Source list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProviderSource"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      operationId: addSource
      tags: [sources]
      summary: Register a provider source
      description: >
        Fetches and validates the catalog first; nothing is written if it cannot be used.
        With a `credential` the request is `Authorization: Bearer` to the catalog's host
        (https only) and, later, the gateway uses it to pull the images installed from this
        source. Error codes: `invalid_source_url` (422), `invalid_credential` (422),
        `credential_requires_https` (422), `credential_with_insecure_registry` (422),
        `source_exists` (409), `catalog_unreachable` / `catalog_unauthorized` /
        `catalog_not_found` (502), `catalog_invalid` (422: not JSON, too large, not a version 2
        catalog).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddSourceRequest"
      responses:
        "201":
          description: Source added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderSource"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/SourceRefused"
        "422":
          $ref: "#/components/responses/SourceRefused"
        "502":
          $ref: "#/components/responses/SourceRefused"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /sources/{source_id}:
    delete:
      operationId: removeSource
      tags: [sources]
      summary: Remove a provider source and uninstall the providers installed from it
      parameters:
        - name: source_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Source removed; `uninstalled` lists the providers that went with it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceRemoved"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/SourceRefused"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    patch:
      operationId: editSource
      tags: [sources]
      summary: Enable or disable a source, or change its token or registry mode
      description: >
        Only the fields present are changed; `credential: null` removes the token. A source
        cannot have a token and `allow_insecure_registry` at once. Disabling a source does not
        uninstall what was installed from it. Error codes: `source_not_found` (404),
        `invalid_credential`, `credential_requires_https`,
        `credential_with_insecure_registry` (422).
      parameters:
        - name: source_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditSourceRequest"
      responses:
        "200":
          description: Updated source
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderSource"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/SourceRefused"
        "422":
          $ref: "#/components/responses/SourceRefused"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /sources/{source_id}/catalog:
    get:
      operationId: browseSourceCatalog
      tags: [sources]
      summary: Browse the catalog of a source
      description: >
        Fetches the catalog now. Each entry says whether it can be installed here (`compatible`:
        it implements this Musizerr's provider API version), whether it is installed and whether
        the catalog offers an update with the difference in permissions. An entry that is not
        valid is in `rejected`, with the reason, and the rest is usable. Error codes:
        `source_not_found` (404), `source_disabled` (409), `catalog_unreachable` /
        `catalog_unauthorized` / `catalog_not_found` (502), `catalog_invalid` (422).
      parameters:
        - name: source_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceCatalog"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/SourceRefused"
        "409":
          $ref: "#/components/responses/SourceRefused"
        "422":
          $ref: "#/components/responses/SourceRefused"
        "502":
          $ref: "#/components/responses/SourceRefused"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /sources/providers/installed:
    get:
      operationId: listInstalledProviders
      tags: [sources]
      summary: List the installed providers
      description: >
        What the admin approved for each (image by digest, roles, permissions), with the update
        its source's catalog offers over it (`update`, with the difference in permissions) or why
        that could not be looked at (`update_error`). `updates=false` skips the catalogs. A newer
        digest is never stored: it is read from the catalog.
      parameters:
        - name: updates
          in: query
          schema:
            type: boolean
            default: true
      responses:
        "200":
          description: Installed providers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InstalledProvider"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /sources/providers/gateway:
    get:
      operationId: getProviderGatewayState
      tags: [sources]
      summary: What the provider gateway runs, and why a provider does not
      description: >
        The gateway's own listing: the state of each provider it was told about (`pulling`,
        `starting`, `running`, `restarting`, `refused`, `unavailable`, `failed`, `stopped`)
        with the reason, whether a sandbox can be made, the entries of the pushed set it
        refused (`rejected`) and the providers it runs that this Musizerr refused to register
        (`host_rejected`). A gateway that does not answer is `reachable: false`, not an error.
      responses:
        "200":
          description: The gateway's state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderGatewayState"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /sources/providers/install:
    post:
      operationId: installProvider
      tags: [sources]
      summary: Install a provider from a source, with the permissions that were shown
      description: >
        Records `image@digest` and the permissions of the catalog entry as approved by the admin
        who sends this, then tells the gateway and every process. `digest` must be the one the
        admin was shown: if the catalog offers another by now the request is refused
        (`catalog_changed`). Error codes: `source_not_found` (404), `provider_not_in_catalog`
        (404), `source_disabled` (409), `already_installed` (409), `catalog_changed` (409),
        `incompatible_provider` (422), and the catalog fetch codes (502/422).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstallRequest"
      responses:
        "201":
          description: Provider installed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstalledProvider"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/SourceRefused"
        "409":
          $ref: "#/components/responses/SourceRefused"
        "422":
          $ref: "#/components/responses/SourceRefused"
        "502":
          $ref: "#/components/responses/SourceRefused"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /sources/providers/{name}/update:
    post:
      operationId: updateInstalledProvider
      tags: [sources]
      summary: Approve and apply the update a source's catalog offers
      description: >
        Moves the provider to the digest (and the permissions) of its catalog entry, which the
        admin saw as `update` in the installed list with the difference in permissions. The
        gateway refuses an image whose labels declare anything else. Error codes:
        `not_installed` (404), `provider_not_in_catalog` (404), `source_disabled` (409),
        `already_current` (409), `catalog_changed` (409), `incompatible_provider` (422), and the
        catalog fetch codes (502/422).
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProviderRequest"
      responses:
        "200":
          description: Provider updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstalledProvider"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/SourceRefused"
        "409":
          $ref: "#/components/responses/SourceRefused"
        "422":
          $ref: "#/components/responses/SourceRefused"
        "502":
          $ref: "#/components/responses/SourceRefused"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /sources/providers/{name}:
    delete:
      operationId: uninstallProvider
      tags: [sources]
      summary: Uninstall a provider
      description: Error code `not_installed` (404).
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Provider uninstalled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/SourceRefused"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  # ════════════════════════════════════════════════════════════════════
  # Download History
  # ════════════════════════════════════════════════════════════════════

  /downloads:
    get:
      operationId: getDownloads
      tags: [history]
      summary: Get paginated download history grouped by track
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: status
          in: query
          required: false
          description: Tracks with at least one attempt in this state.
          schema:
            $ref: "#/components/schemas/DownloadStatus"
        - name: phase
          in: query
          required: false
          description: >
            Tracks whose aggregated state (the most advanced of the attempts
            the caller sees) is in one of these phases — the grouping counted
            by GET /downloads/summary. Repeatable.
          schema:
            type: array
            items:
              $ref: "#/components/schemas/DownloadPhase"
        - name: q
          in: query
          required: false
          description: Matches title, artist or album.
          schema:
            type: string
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [recent, title, artist]
            default: recent
      responses:
        "200":
          description: Paginated download list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadsPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: Invalid query parameter
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /downloads/summary:
    get:
      operationId: getDownloadsSummary
      tags: [history]
      summary: Download counters per aggregated state and phase
      description: >
        Same visibility as GET /downloads: an admin counts the whole instance,
        a user their own requests and the ones they follow.
      parameters:
        - name: days
          in: query
          required: false
          description: Window for downloaded_since.
          schema:
            type: integer
            minimum: 1
            maximum: 90
            default: 7
      responses:
        "200":
          description: Counters
          content:
            application/json:
              schema:
                type: object
                required: [statuses, phases, total, downloaded_since]
                properties:
                  statuses:
                    type: object
                    description: Tracks per aggregated state (every state is present).
                    additionalProperties:
                      type: integer
                  phases:
                    type: object
                    description: Tracks per phase (every phase is present).
                    additionalProperties:
                      type: integer
                  total:
                    type: integer
                  downloaded_since:
                    type: integer
                    description: Tracks that landed in the library in the last `days` days.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /downloads/{track_id}/retry:
    post:
      operationId: retryDownload
      tags: [history]
      summary: Retry a failed download
      description: >
        Requires a signed-in user when auth is enabled: a guest gets 401 and
        nothing is created or queued. With auth disabled the download has no
        requester. Same gate as POST /download/track: a track in the library
        is not downloaded again unless an admin sends `force`. A retry is not a
        request: it runs again a download that exists, and a download exists
        only because a request was approved. A user the approval policy
        governs may therefore retry only a track they have a download of (their
        own, or one they joined); any other track is 403 `retry_not_approved`.
        Admins, and auth disabled, may retry any track.
      parameters:
        - name: track_id
          in: path
          required: true
          schema:
            type: string
        - name: add_to_favorites
          in: query
          description: >
            Admins (and auth disabled) only: add the tracks to your favorites when
            they arrive. A user's retry always does.
          schema:
            type: boolean
        - name: force
          in: query
          description: Admins only (403 otherwise) — download again a track already in the library.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: The request's outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadRequestResult"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >
            Not an admin and asked for `force`, or the track has no download of
            the user's to retry (`detail.error_code` `retry_not_approved`).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ErrorResponse"
                  - $ref: "#/components/schemas/CodedErrorResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  # ════════════════════════════════════════════════════════════════════
  # Streaming
  # ════════════════════════════════════════════════════════════════════

  /stream/{track_id}:
    get:
      operationId: streamTrack
      tags: [stream]
      summary: Stream a downloaded track from storage
      description: >
        The track's file on the storage provider (never one the library file
        reconciliation found missing), else the copy a sync provider indexed —
        also when the storage lost the file or does not answer. Every step
        before the storage's first byte waits at most `stream_start_timeout`;
        a storage that did not answer rests `storage_stream_cooldown_seconds`,
        and meanwhile a track with a sync copy plays that copy at once. Only
        audio is streamed: an origin that answers anything else is a 502,
        decided before any audio is sent. A remote storage streams the file as
        it arrives (no wait for the whole transfer); one that can restart a
        transfer at an offset answers a Range request with a 206 from there.
      parameters:
        - name: track_id
          in: path
          required: true
          schema:
            type: string
        - name: Range
          in: header
          required: false
          schema:
            type: string
      security:
        - StreamCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: Audio stream
          content:
            audio/*:
              schema:
                type: string
                format: binary
        "206":
          description: Part of the audio stream, for a Range request
        "401":
          $ref: "#/components/responses/Unauthorized"
        "416":
          description: The Range starts past the end of the file (Content-Range carries its size).
        "404":
          description: >
            No file in the library for this track, or the storage no longer has
            it (and no sync provider has a copy).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          $ref: "#/components/responses/ProviderFailed"
        "503":
          description: >
            Retryable: no storage provider is available, or the storage (or the
            sync provider behind the stream) does not answer.
          headers:
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderErrorResponse"

  /stream/provider/{provider_name}/{track_id}:
    get:
      operationId: streamFromProvider
      tags: [stream]
      summary: Proxy audio stream from a sync provider
      parameters:
        - name: provider_name
          in: path
          required: true
          schema:
            type: string
        - name: track_id
          in: path
          required: true
          schema:
            type: string
      security:
        - StreamCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: Proxied audio stream
          content:
            audio/*:
              schema:
                type: string
                format: binary
        "206":
          description: Part of the audio stream, for a Range request
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          description: >
            The sync provider answered with an error, or with something that is
            not audio (decided before any audio is sent).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderErrorResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /playback/{provider}/{provider_id}:
    get:
      operationId: getPlaybackInfo
      tags: [stream]
      summary: Get playback info for a track
      description: >
        Returns whether full playback or preview-only is available for a track
        identified by provider + provider_id: full when `/stream/{track_id}`
        has a source (a stored file not known missing, or a sync provider's
        copy), decided on the database without asking the storage.
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
        - name: provider_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Playback availability
          content:
            application/json:
              schema:
                type: object
                required: [type, stream_url]
                properties:
                  type:
                    type: string
                    enum: [full, preview, none]
                    description: none when neither the stored file nor a preview can be played.
                  stream_url:
                    type: [string, "null"]
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  # ════════════════════════════════════════════════════════════════════
  # System
  # ════════════════════════════════════════════════════════════════════

  /progress:
    get:
      operationId: progressStream
      tags: [system]
      summary: SSE stream of download progress events
      description: >
        Server-Sent Events endpoint. Events are published by Celery workers
        via Redis pub/sub. Format: `data: {"download_id": "...", "status": "...", ...}`.
        Authenticated like full audio (stream cookie, or a bearer token for API
        clients). Each user receives only the events of downloads they can see in
        GET /downloads (their own and those they follow) and events addressed to
        them (user_id); admins, and everyone with auth disabled, receive every
        download event. An event with a user_id (e.g. a LibraryJobEvent,
        `{"type": "library_job", "user_id": "...", "run": {...}}`) reaches only
        that user, admins included. A DownloadRequestEvent tells a requester how
        their request was decided and, with no `user_id`, the admins that one
        is waiting.
      security:
        - StreamCookie: []
        - BearerAuth: []
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: SSE event stream
          content:
            text/event-stream:
              schema:
                type: string
                description: >
                  Each event is a JSON-encoded ProgressEvent, LibraryJobEvent or
                  DownloadRequestEvent.
                  Keepalive comments (`: keepalive`) are sent every 15s.
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /health:
    get:
      operationId: health
      tags: [system]
      summary: Health check
      description: >
        Everyone gets status and db. Admins (read from the signed access token,
        so the check answers while the database is down), and everyone with
        auth disabled, also get providers and, on a database failure, db_detail.
      security:
        - {}
        - BearerAuth: []
      responses:
        "200":
          description: System health status
          content:
            application/json:
              schema:
                type: object
                required: [status, db]
                properties:
                  status:
                    type: string
                    enum: [ok, degraded]
                  db:
                    type: string
                    enum: [ok, error]
                  db_detail:
                    type: string
                    description: Raw database error, admins only.
                  providers:
                    description: Admins only.
                    oneOf:
                      - type: object
                        properties:
                          metadata:
                            type: array
                            items:
                              type: string
                          download:
                            type: array
                            items:
                              type: string
                      - type: string
                        description: '"not initialized" if registry failed'
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  # ════════════════════════════════════════════════════════════════════
  # External utility intake
  # ════════════════════════════════════════════════════════════════════
  #
  # The paths of a program of its own that captures an account for a provider
  # (`AuthFlow.EXTERNAL_UTILITY`). `{intake_name}` is the `intake_name` the provider
  # declares in its `ExternalUtilityConfig`; nothing is served for a name nobody declares.

  /credentials/{intake_name}_api_config:
    parameters:
      - $ref: "#/components/parameters/IntakeName"
    get:
      operationId: getExternalUtilityOAuthClient
      tags: [external-utility]
      summary: Whether the OAuth client the provider borrows is configured (for the capture utility)
      description: >
        Admin-only, also under /api. 404 when no provider declares the name or the
        provider borrows no OAuth client. The client secret is never returned: it is
        masked, which is all the utility checks.
      responses:
        "200":
          description: OAuth client config, secret masked
          content:
            application/json:
              schema:
                type: object
                required: [client_id, client_secret, configured]
                properties:
                  client_id:
                    type: string
                  client_secret:
                    type: string
                    description: '"********" when set, "" otherwise.'
                  configured:
                    type: boolean
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    put:
      operationId: putExternalUtilityOAuthClient
      tags: [external-utility]
      summary: Set the OAuth client the provider borrows (for the capture utility)
      description: Admin-only, also under /api. 404 as for the read.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExternalUtilityOAuthClientBody"
      responses:
        "200":
          description: Config saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /credentials/{intake_name}:
    parameters:
      - $ref: "#/components/parameters/IntakeName"
    get:
      operationId: listExternalUtilityAccounts
      tags: [external-utility]
      summary: List the accounts the utility registered
      description: >
        Admin-only, also under /api. 404 when no provider declares the name. Each
        account is shown with the fields the provider declares
        (`account_display_fields`).
      responses:
        "200":
          description: Account list
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [name]
                  additionalProperties:
                    type: string
                  properties:
                    name:
                      type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /credentials/{intake_name}/{account_name}:
    parameters:
      - $ref: "#/components/parameters/IntakeName"
      - name: account_name
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: registerExternalUtilityAccount
      tags: [external-utility]
      summary: Register an account (called by the capture utility)
      description: >
        Admin-only, also under /api. The object is kept as received, with the time of
        registration, for the provider. 404 when no provider declares the name.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExternalUtilityAccountBody"
      responses:
        "200":
          description: Account registered
          content:
            application/json:
              schema:
                type: object
                required: [ok, account]
                additionalProperties:
                  type: string
                properties:
                  ok:
                    type: boolean
                  account:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    delete:
      operationId: deleteExternalUtilityAccount
      tags: [external-utility]
      summary: Delete an account
      description: Admin-only, also under /api.
      responses:
        "200":
          description: Account deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  # ════════════════════════════════════════════════════════════════════
  # Account (additional)
  # ════════════════════════════════════════════════════════════════════

  /auth/account/stream-session:
    post:
      operationId: startStreamSession
      tags: [user-auth]
      summary: Set the stream cookie for full audio and the progress stream
      description: >
        Mints a short-lived stream token as an HttpOnly cookie (path /). The web
        app calls it after login and after every access-token refresh.
      responses:
        "204":
          description: Cookie set
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    delete:
      operationId: endStreamSession
      tags: [user-auth]
      summary: Clear the stream cookie
      security: []
      responses:
        "204":
          description: Cookie cleared
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /auth/login:
    post:
      operationId: loginForExternalTools
      tags: [user-auth]
      summary: Login for external tools that call /auth/login (also /api/auth/login)
      description: Same rules as POST /auth/account/login; the response also carries the user's name and role.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
      responses:
        "200":
          description: Tokens and user
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/TokenResponse"
                  - type: object
                    properties:
                      user:
                        type: object
                        properties:
                          username:
                            type: string
                          role:
                            type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /auth/{provider}/authorize-url:
    get:
      operationId: getAuthorizeUrl
      tags: [auth]
      summary: OAuth2 authorization URL for a provider
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
        - name: target
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AccountTarget"
          description: >-
            The account the call is about. Omitted: the caller's own when the provider has personal
            accounts, else the shared one. `shared` needs the admin role; a model without that account is a 400.
      responses:
        "200":
          description: URL to redirect the browser to
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /auth/linked-accounts:
    get:
      operationId: listLinkedAccounts
      tags: [auth]
      summary: The providers the caller may connect their own account to, with what is connected
      description: >-
        Built from each provider's declared account model (`personal` and `personal_with_shared`),
        never from a list of names. The shared account of the instance is managed by admins
        (`target=shared` on the connect, test and disconnect routes).
      responses:
        "200":
          description: One entry per provider with personal accounts
          content:
            application/json:
              schema:
                type: object
                required: [accounts]
                properties:
                  accounts:
                    type: array
                    items:
                      $ref: "#/components/schemas/LinkedAccount"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /auth/me/accounts:
    delete:
      operationId: deleteMyProviderAccounts
      tags: [auth]
      summary: Disconnect every account the current user connected (never the shared ones)
      responses:
        "200":
          description: Credentials removed
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  # ════════════════════════════════════════════════════════════════════
  # Public showcase: providers, discover, covers
  # ════════════════════════════════════════════════════════════════════
        "403":
          $ref: "#/components/responses/Forbidden"

  /providers/public:
    get:
      operationId: listPublicProviders
      tags: [config]
      summary: Provider labels and metadata priority, without login
      description: Only ids, labels and the configured metadata priority; no credentials, configuration or status.
      security: []
      responses:
        "200":
          description: Public provider labels
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicProviders"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /discover/new-releases:
    get:
      operationId: discoverNewReleases
      tags: [discover]
      summary: New releases from the metadata providers
      security: []
      parameters:
        - $ref: "#/components/parameters/DiscoverLimit"
      responses:
        "200":
          description: Albums
          content:
            application/json:
              schema:
                type: object
                required: [items, provider_errors]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Album"
                  provider_errors:
                    $ref: "#/components/schemas/ProviderErrors"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /discover/trending/albums:
    get:
      operationId: discoverTrendingAlbums
      tags: [discover]
      summary: Trending albums
      security: []
      parameters:
        - $ref: "#/components/parameters/DiscoverLimit"
      responses:
        "200":
          description: Albums
          content:
            application/json:
              schema:
                type: object
                required: [items, provider_errors]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Album"
                  provider_errors:
                    $ref: "#/components/schemas/ProviderErrors"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /discover/trending/tracks:
    get:
      operationId: discoverTrendingTracks
      tags: [discover]
      summary: Trending tracks
      security: []
      parameters:
        - $ref: "#/components/parameters/DiscoverLimit"
      responses:
        "200":
          description: Tracks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackList"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /discover/trending/artists:
    get:
      operationId: discoverTrendingArtists
      tags: [discover]
      summary: Trending artists
      security: []
      parameters:
        - $ref: "#/components/parameters/DiscoverLimit"
      responses:
        "200":
          description: Artists
          content:
            application/json:
              schema:
                type: object
                required: [items, provider_errors]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Artist"
                  provider_errors:
                    $ref: "#/components/schemas/ProviderErrors"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /cover/provider/{provider_name}/{cover_id}:
    get:
      operationId: proxyCover
      tags: [stream]
      summary: Cover art a provider serves through the host
      description: >
        Built by providers with their context (cover_url); the URL already
        carries the public API prefix. Only an image is served: anything else
        the provider answers (an error document with a 200 included) is a 404,
        remembered for a few minutes.
      security: []
      parameters:
        - name: provider_name
          in: path
          required: true
          schema:
            type: string
        - name: cover_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Image bytes
          content:
            image/*:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/ProviderFailed"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /preview/{provider_name}/{track_id}:
    get:
      operationId: proxyPreview
      tags: [stream]
      summary: A track preview a provider serves through the host
      description: >
        Built by providers whose preview URLs are signed and expire, with
        their context (preview_url); the URL already carries the public API
        prefix and never expires. The host asks the provider for a fresh URL
        when a listen starts (reused for a couple of minutes by the requests
        of that listen, asked again if it fails) and proxies the audio,
        honouring Range. Public, like the previews.
      security: []
      parameters:
        - name: provider_name
          in: path
          required: true
          schema:
            type: string
        - name: track_id
          in: path
          required: true
          schema:
            type: string
        - name: Range
          in: header
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Audio bytes
          content:
            audio/*:
              schema:
                type: string
                format: binary
        "206":
          description: Partial audio (Range)
          content:
            audio/*:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/ProviderFailed"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  # ════════════════════════════════════════════════════════════════════
  # Track and artist detail additions
  # ════════════════════════════════════════════════════════════════════

  /track/{provider}/{id}/related:
    get:
      operationId: getRelatedTracks
      tags: [track]
      summary: Tracks related to a track, from every metadata provider
      description: >
        First the variants of the same track (find_related_tracks: other
        versions and releases), then similar tracks (find_similar_tracks: artist
        radio, recommendations), each group from every metadata provider in
        metadata_provider_priority order. Deduplicated with the core track
        matcher, without the track itself (a similar track matching it is left
        out too), annotated with download status. A failing provider is skipped.
        Empty when no configured provider offers either: clients hide the section.
      security: []
      parameters:
        - $ref: "#/components/parameters/Provider"
        - $ref: "#/components/parameters/ItemId"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: Related tracks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackList"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/ProviderFailed"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /track/{provider}/{id}/appears-on:
    get:
      operationId: getAppearsOn
      tags: [track]
      summary: Releases that contain the same recording (same ISRC or MBID)
      security: []
      parameters:
        - $ref: "#/components/parameters/Provider"
        - $ref: "#/components/parameters/ItemId"
      responses:
        "200":
          description: One entry per release title and year, from the highest-priority provider
          content:
            application/json:
              schema:
                type: object
                required: [items, provider_errors]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/AppearsOnRelease"
                  provider_errors:
                    $ref: "#/components/schemas/ProviderErrors"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/ProviderFailed"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /artist/{provider}/{id}/top-tracks:
    get:
      operationId: getArtistTopTracks
      tags: [artist]
      summary: The artist's most popular tracks
      description: >
        From the requested provider first and, while tracks are missing, from the
        other metadata providers in metadata_provider_priority order (the artist is
        found there through cross-enrichment). Deduplicated with the core track
        matcher and annotated with download status. A failing provider is skipped;
        if every provider queried fails, the answer is 200 with an empty list and
        error_code/error_message.
      security: []
      parameters:
        - $ref: "#/components/parameters/Provider"
        - $ref: "#/components/parameters/ItemId"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        "200":
          description: Popular tracks
          content:
            application/json:
              schema:
                type: object
                required: [items, error_code, error_message, provider_errors]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Track"
                  provider_errors:
                    $ref: "#/components/schemas/ProviderErrors"
                  error_code:
                    type: [string, "null"]
                  error_message:
                    type: [string, "null"]
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/ProviderFailed"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /downloads/retry-failed:
    post:
      operationId: retryFailedDownloads
      tags: [history]
      summary: Retry every failed download the caller can see
      description: >
        Same rule as the single retry (a signed-in user when auth is enabled).
        Admins, and auth-disabled, see every download. Idempotent: a retried track
        is no longer failed, so a second call queues nothing.
      parameters:
        - name: add_to_favorites
          in: query
          description: >
            Admins (and auth disabled) only: add the tracks to your favorites when
            they arrive. A user's retry always does.
          schema:
            type: boolean
      responses:
        "200":
          description: Ids of the downloads queued
          content:
            application/json:
              schema:
                type: object
                required: [download_ids]
                properties:
                  download_ids:
                    type: array
                    items:
                      type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  # ════════════════════════════════════════════════════════════════════
  # Library
  # ════════════════════════════════════════════════════════════════════

  /playlists:
    get:
      operationId: listPlaylists
      tags: [playlists]
      summary: The current user's playlists (own and followed)
      description: >
        Private: only the caller's playlists, oldest first, without their
        tracks. `max_tracks` is the admin's cap per playlist (setting
        `playlist_max_tracks`). `synced_to` lists the sync providers that hold a
        copy on the caller's own account.
      responses:
        "200":
          description: The playlists
          content:
            application/json:
              schema:
                type: object
                required: [items, max_tracks]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/PlaylistSummary"
                  max_tracks:
                    type: integer
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      operationId: createPlaylist
      tags: [playlists]
      summary: Create an empty playlist of the caller's own
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaylistBody"
      responses:
        "201":
          description: The new playlist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaylistSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/BadRequest"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /playlists/follow:
    post:
      operationId: followPlaylist
      tags: [playlists]
      summary: Follow a playlist of a metadata provider
      description: >
        Keeps the playlist's tracks (read-only; they follow the source when the
        provider's version marker changes, see `refresh_followed_playlists`) and
        asks to download them through the download approval policy, as the
        caller. The tracks do NOT become favorites. Following a playlist already
        followed answers 200 with `created: false` and asks for nothing.
        `download.status` says what the request came to: `queued`,
        `pending_approval` (it waits for an admin; the playlist is kept),
        `none` (nothing to ask for) or `error` (the request failed; the playlist
        stays). A provider that does not hand out the tracks of a playlist
        (`tracks_unavailable`, e.g. `access_restricted`: a provider that only
        shares the tracks of the playlists the connected account owns or
        collaborates on declares the capability `playlist_tracks_restricted`) is
        followed all the same, with no tracks and nothing to download. 409
        `playlist_full` when the playlist has more tracks than the cap.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, id]
              properties:
                provider:
                  type: string
                id:
                  type: string
      responses:
        "200":
          description: Already followed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowResult"
        "201":
          description: Followed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The playlist is longer than the cap (`playlist_full`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaylistErrorResponse"
        "422":
          $ref: "#/components/responses/BadRequest"
        "502":
          $ref: "#/components/responses/ProviderFailed"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /playlists/{playlist_id}:
    parameters:
      - name: playlist_id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getUserPlaylist
      tags: [playlists]
      summary: A playlist of the caller, with its tracks in order
      description: >
        The tracks carry the same state as any track list (`download_status`,
        `in_library`, `favorite`, `playback`) and `added_at`. Somebody else's
        playlist is a 404.
      responses:
        "200":
          description: The playlist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaylistDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such playlist of the caller (`playlist_not_found`), or a track the host does not know (`track_not_found`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaylistErrorResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    patch:
      operationId: updatePlaylist
      tags: [playlists]
      summary: Rename or re-describe an own playlist
      description: >
        A followed playlist is read-only (409 `playlist_read_only`): only
        `auto_download` (download what its source gains) can change on it, and
        `auto_download` on an own playlist is 422 `playlist_not_followed`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaylistPatch"
      responses:
        "200":
          description: The playlist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaylistSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such playlist of the caller (`playlist_not_found`), or a track the host does not know (`track_not_found`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaylistErrorResponse"
        "409":
          description: A followed playlist cannot be edited (`playlist_read_only`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaylistErrorResponse"
        "422":
          description: Invalid body, or `playlist_not_followed`
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/PlaylistErrorResponse"
                  - $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    delete:
      operationId: deletePlaylist
      tags: [playlists]
      summary: Delete an own playlist, or unfollow a followed one
      description: >
        By default only the playlist goes: its tracks stay in the library. With
        `delete_tracks=true` the files that were downloaded for this playlist
        (a followed playlist's download request) are deleted too, in the
        background (`tracks_scheduled`), but only those that no other playlist
        holds and no user has as a favorite, and only files Musizerr downloaded
        for the caller. Its copies on the sync providers are deleted by the
        next run of `sync_playlists`.
      parameters:
        - name: delete_tracks
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                required: [deleted, tracks_scheduled]
                properties:
                  deleted:
                    type: boolean
                  tracks_scheduled:
                    type: integer
                    description: Tracks whose files a background task will delete.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such playlist of the caller (`playlist_not_found`), or a track the host does not know (`track_not_found`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaylistErrorResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /playlists/{playlist_id}/tracks:
    parameters:
      - name: playlist_id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: addPlaylistTracks
      tags: [playlists]
      summary: Append tracks to an own playlist
      description: >
        Each item is a track the host knows (`track_id`: the `library_id` of a
        listed track) or one a provider names (`provider` + `provider_id`, read
        from the provider). A track already in the playlist is skipped. All or
        nothing: a batch that would pass the cap is refused (409
        `playlist_full`); a followed playlist is 409 `playlist_read_only`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items:
                    $ref: "#/components/schemas/PlaylistTrackRef"
      responses:
        "200":
          description: What was added
          content:
            application/json:
              schema:
                type: object
                required: [added, skipped_duplicates, playlist]
                properties:
                  added:
                    type: integer
                  skipped_duplicates:
                    type: integer
                  playlist:
                    $ref: "#/components/schemas/PlaylistSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such playlist of the caller (`playlist_not_found`), or a track the host does not know (`track_not_found`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaylistErrorResponse"
        "409":
          description: The playlist is full (`playlist_full`) or followed (`playlist_read_only`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaylistErrorResponse"
        "422":
          $ref: "#/components/responses/BadRequest"
        "502":
          $ref: "#/components/responses/ProviderFailed"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /playlists/{playlist_id}/tracks/order:
    parameters:
      - name: playlist_id
        in: path
        required: true
        schema:
          type: string
    put:
      operationId: reorderPlaylistTracks
      tags: [playlists]
      summary: Put the tracks of an own playlist in a new order
      description: >
        `track_ids` must list exactly the playlist's tracks, once each: a client
        that read an old list never loses or invents a track (422
        `playlist_invalid_order`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [track_ids]
              properties:
                track_ids:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: The new order
          content:
            application/json:
              schema:
                type: object
                required: [track_ids]
                properties:
                  track_ids:
                    type: array
                    items:
                      type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such playlist of the caller (`playlist_not_found`), or a track the host does not know (`track_not_found`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaylistErrorResponse"
        "409":
          description: A followed playlist cannot be edited (`playlist_read_only`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaylistErrorResponse"
        "422":
          description: Not exactly the playlist's tracks (`playlist_invalid_order`), or an invalid body
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/PlaylistErrorResponse"
                  - $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /playlists/{playlist_id}/tracks/{track_id}:
    parameters:
      - name: playlist_id
        in: path
        required: true
        schema:
          type: string
      - name: track_id
        in: path
        required: true
        schema:
          type: string
    delete:
      operationId: removePlaylistTrack
      tags: [playlists]
      summary: Take a track out of an own playlist
      description: Idempotent; the track's file stays in the library.
      responses:
        "200":
          description: Whether the track was in the playlist
          content:
            application/json:
              schema:
                type: object
                required: [track_id, removed]
                properties:
                  track_id:
                    type: string
                  removed:
                    type: boolean
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such playlist of the caller (`playlist_not_found`), or a track the host does not know (`track_not_found`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaylistErrorResponse"
        "409":
          description: A followed playlist cannot be edited (`playlist_read_only`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaylistErrorResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /playlists/{playlist_id}/duplicate:
    parameters:
      - name: playlist_id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: duplicatePlaylist
      tags: [playlists]
      summary: An own, editable copy of a playlist
      description: >
        Works on any playlist of the caller, a followed one included ("Duplicate
        as mine"): the copy has the tracks the playlist has now and no link to
        its source. Without a `name` it is "<name> (copy)".
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: [string, "null"]
                  maxLength: 200
      responses:
        "201":
          description: The copy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaylistSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such playlist of the caller (`playlist_not_found`), or a track the host does not know (`track_not_found`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaylistErrorResponse"
        "422":
          $ref: "#/components/responses/BadRequest"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /playlists/{playlist_id}/refresh:
    parameters:
      - name: playlist_id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: refreshPlaylist
      tags: [playlists]
      summary: Look at the source of a followed playlist now
      description: >
        What `refresh_followed_playlists` does periodically, for one playlist and
        reading its tracks whatever the provider's version marker says: the
        tracks the source gained are added (and downloaded when
        `auto_download`, through the approval policy), the ones it lost are
        dropped (their files stay). 422 `playlist_not_followed` for an own
        playlist.
      responses:
        "200":
          description: What changed
          content:
            application/json:
              schema:
                type: object
                required: [playlist, changed, new_tracks, removed_tracks, error_code, download]
                properties:
                  playlist:
                    $ref: "#/components/schemas/PlaylistSummary"
                  changed:
                    type: boolean
                  new_tracks:
                    type: integer
                  removed_tracks:
                    type: integer
                  error_code:
                    type: [string, "null"]
                    description: >
                      Why the source could not be applied (`playlist_source_not_found`,
                      `playlist_full`); null when it was.
                  download:
                    $ref: "#/components/schemas/PlaylistDownload"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such playlist of the caller (`playlist_not_found`), or a track the host does not know (`track_not_found`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaylistErrorResponse"
        "422":
          description: An own playlist has no source (`playlist_not_followed`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaylistErrorResponse"
        "502":
          $ref: "#/components/responses/ProviderFailed"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /favorites:
    get:
      operationId: getFavorites
      tags: [library]
      summary: The current user's favorites (tracks of the library)
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 200
        - name: q
          in: query
          schema:
            type: string
        - name: sort
          in: query
          schema:
            type: string
            enum: [added_desc, added_asc, title, artist, year_desc, year_asc]
            default: added_desc
      responses:
        "200":
          description: Paginated favorites
          content:
            application/json:
              schema:
                type: object
                required: [items, total, page, limit, pages]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/FavoriteTrack"
                  total:
                    type: integer
                  page:
                    type: integer
                  limit:
                    type: integer
                  pages:
                    type: integer
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /favorites/{track_id}:
    parameters:
      - name: track_id
        in: path
        required: true
        description: The track's `library_id`.
        schema:
          type: string
    get:
      operationId: getFavorite
      tags: [library]
      summary: Whether a track is in the library and a favorite of the caller
      responses:
        "200":
          description: The track's state for the caller
          content:
            application/json:
              schema:
                type: object
                required: [track_id, favorite, in_library]
                properties:
                  track_id:
                    type: string
                  favorite:
                    type: boolean
                  in_library:
                    type: boolean
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    put:
      operationId: addFavorite
      tags: [library]
      summary: The heart — make a track of the library a favorite
      description: >
        Idempotent. The like is propagated to the sync provider. Only a track in
        the library can be a favorite: 409 `not_in_library` otherwise.
      responses:
        "200":
          description: The track is a favorite
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FavoriteChange"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The track is not in the library
          content:
            application/json:
              schema:
                type: object
                required: [detail]
                properties:
                  detail:
                    type: object
                    required: [error_code, error_message]
                    properties:
                      error_code:
                        type: string
                        enum: [not_in_library]
                      error_message:
                        type: string
                      track_id:
                        type: string
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    delete:
      operationId: removeFavorite
      tags: [library]
      summary: The heart, off — the file stays in the library
      description: >
        Idempotent. The like is also taken back on the sync provider. The song
        stays off: the removal is remembered by what names the song (its
        stable identifiers, its title and artists), so a re-import of the like
        from another provider, on whatever record, never makes it a favorite
        again; only a new heart or download of the user's own does.
      responses:
        "200":
          description: The track is not a favorite
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FavoriteChange"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /favorites/batch:
    post:
      operationId: addFavorites
      tags: [library]
      summary: Favorite several tracks (an album's or a playlist's tracks in library)
      description: Only the tracks in the library are added; the others come back in `skipped`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [track_ids]
              properties:
                track_ids:
                  type: array
                  maxItems: 500
                  items:
                    type: string
      responses:
        "200":
          description: What was added and what was not in the library
          content:
            application/json:
              schema:
                type: object
                required: [added, skipped]
                properties:
                  added:
                    type: array
                    items:
                      type: string
                  skipped:
                    type: array
                    items:
                      type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/BadRequest"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /favorites/elsewhere:
    get:
      operationId: getLikedElsewhere
      tags: [library]
      summary: Liked on other providers, not in the library
      description: >
        The likes imported by the library sync that no library track matched.
        Downloading one (for a user, download = favorite on arrival) brings it in.
        `total` counts the same rows the page lists: reading never changes what
        is in the library (the sync presence is indexed by a job, not by a read).
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 200
        - name: provider
          in: query
          schema:
            type: string
        - name: q
          in: query
          schema:
            type: string
        - name: sort
          in: query
          schema:
            type: string
            default: added_desc
      responses:
        "200":
          description: Paginated likes not in the library
          content:
            application/json:
              schema:
                type: object
                required: [items, total, page, limit, pages]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/LikedElsewhereTrack"
                  total:
                    type: integer
                  page:
                    type: integer
                  limit:
                    type: integer
                  pages:
                    type: integer
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /library/saved-tracks:
    delete:
      operationId: deleteSavedTracks
      tags: [library]
      summary: Wipe the likes imported from other providers and the sync history (favorites stay)
      responses:
        "200":
          description: Library wiped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /library/sync:
    post:
      operationId: triggerLibrarySync
      tags: [library]
      summary: Sync the current user's likes from their providers
      description: >
        Idempotent. The run is persisted `queued` before its task is
        enqueued; while a run is queued or running, that run is returned
        (200, created false) instead of starting another. 503
        `queue_unavailable` when the task cannot be enqueued (the run is
        closed as failed). Progress: GET /library/sync/status, and
        `library_job` events on /progress.
      responses:
        "202":
          description: A new run, queued (library sync)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryJobStarted"
        "200":
          description: A run was already queued or running; it is returned and nothing new starts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryJobStarted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /library/sync/status:
    get:
      operationId: getLibrarySyncStatus
      tags: [library]
      summary: Latest library sync of the current user, with its progress
      description: >
        The source of truth for the run (the /progress events are a live
        copy). Stale runs are closed first. On failure non-admins get
        error_code and a readable error_message; the raw error is in
        error_detail for admins only.
      responses:
        "200":
          description: The latest run, or status never_run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryJobRun"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /library/download-sync:
    post:
      operationId: triggerLibraryDownloadSync
      tags: [library]
      summary: Download the likes that are not in the library yet
      description: >
        Idempotent like POST /library/sync. The downloads arrive as the
        user's favorites. It is a `liked_elsewhere` download request: for a
        user the approval policy governs, the run may end with the request
        waiting for an admin instead of queueing the tracks (see `result` of
        the run).
      parameters:
        - name: time_range
          in: query
          schema:
            type: string
            enum: [all, 1m, 3m]
            default: all
      responses:
        "202":
          description: A new run, queued (download sync)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryJobStarted"
        "200":
          description: A run was already queued or running; it is returned and nothing new starts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryJobStarted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /library/download-sync/status:
    get:
      operationId: getLibraryDownloadSyncStatus
      tags: [library]
      summary: Latest "download missing" of the current user, with its progress
      responses:
        "200":
          description: The latest run, or status never_run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryJobRun"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /library/jobs:
    get:
      operationId: getLibraryJobs
      tags: [library]
      summary: Latest run of every library job of the current user
      responses:
        "200":
          description: One run (or never_run) per kind
          content:
            application/json:
              schema:
                type: object
                required: [library_sync, download_sync]
                properties:
                  library_sync:
                    $ref: "#/components/schemas/LibraryJobRun"
                  download_sync:
                    $ref: "#/components/schemas/LibraryJobRun"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /library/duplicates:
    get:
      operationId: getDuplicateGroups
      tags: [library]
      summary: Duplicate groups found by the duplicates scan (admin)
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [proposed, needs_review, resolved, dismissed]
      responses:
        "200":
          description: Groups
          content:
            application/json:
              schema:
                type: object
                properties:
                  groups:
                    type: array
                    items:
                      $ref: "#/components/schemas/DuplicateGroup"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /library/duplicates/{group_id}/resolve:
    post:
      operationId: resolveDuplicateGroup
      tags: [library]
      summary: Keep one member and delete the others that musizerr put there (admin)
      parameters:
        - name: group_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [keep_member_id]
              properties:
                keep_member_id:
                  type: string
      responses:
        "200":
          description: Group resolved
          content:
            application/json:
              schema:
                type: object
                properties:
                  group_id:
                    type: string
                  status:
                    type: string
                  deleted:
                    type: array
                    items:
                      type: string
                  skipped_non_deletable:
                    type: array
                    items:
                      type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /library/duplicates/resolve-all:
    post:
      operationId: resolveAllDuplicateGroups
      tags: [library]
      summary: Resolve every proposed group with its proposed keeper (admin)
      responses:
        "200":
          description: One result per group
          content:
            application/json:
              schema:
                type: object
                properties:
                  resolved:
                    type: array
                    items:
                      type: object
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /library/duplicates/members/{member_id}/stream:
    get:
      operationId: streamDuplicateMember
      tags: [library, stream]
      summary: Stream one file of a duplicate group (admin)
      description: >
        Plays THAT file, so an admin can hear each copy before choosing the one
        to keep: by the member's sync id on the sync provider whose library the
        duplicates scan read, else by its real path on the storage (the
        Musizerr download it is linked to). Never the track-level stream
        (`/stream/{track_id}`), which picks one file of the track by itself.
        Range requests pass through, as for `/stream/{track_id}`.
      parameters:
        - name: member_id
          in: path
          required: true
          schema:
            type: string
        - name: Range
          in: header
          required: false
          schema:
            type: string
      security:
        - StreamCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: Audio stream
          content:
            audio/*:
              schema:
                type: string
                format: binary
        "206":
          description: Part of the audio stream, for a Range request
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: >
            No such member, its file was already deleted, or neither the sync
            provider nor the storage can play it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "416":
          description: The Range starts past the end of the file (Content-Range carries its size).
        "502":
          $ref: "#/components/responses/ProviderFailed"
        "503":
          description: >
            Retryable: the sync provider or the storage does not answer.
          headers:
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderErrorResponse"

  /library/duplicates/{group_id}/dismiss:
    post:
      operationId: dismissDuplicateGroup
      tags: [library]
      summary: Mark a group as not a duplicate (admin)
      parameters:
        - name: group_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Group dismissed
          content:
            application/json:
              schema:
                type: object
                properties:
                  group_id:
                    type: string
                  status:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  # ════════════════════════════════════════════════════════════════════
  # Settings, config and routines
  # ════════════════════════════════════════════════════════════════════

  /settings/schema:
    get:
      operationId: getSettingsSchema
      tags: [settings]
      summary: Unified settings schema readable by the current user
      description: >
        Core catalog plus every provider's settings, filtered by the read policy
        of the user's role, with availability. taxonomy carries areas and groups
        with a stable label_key (settings.areas.<key>, settings.groups.<key>) for
        translation and a default label; groups also carry description_key
        (settings.group_descriptions.<key>) for their description.
      responses:
        "200":
          description: Schema and taxonomy
          content:
            application/json:
              schema:
                type: object
                required: [settings, taxonomy]
                properties:
                  settings:
                    type: array
                    items:
                      $ref: "#/components/schemas/SettingDefinition"
                  taxonomy:
                    type: object
                    properties:
                      areas:
                        type: array
                        items:
                          type: object
                          required: [key, label_key, label]
                          properties:
                            key:
                              type: string
                            label_key:
                              type: string
                            label:
                              type: string
                      groups:
                        type: array
                        items:
                          type: object
                          required: [key, label_key, label, description_key, area]
                          properties:
                            key:
                              type: string
                            label_key:
                              type: string
                            label:
                              type: string
                            description_key:
                              type: string
                            description:
                              type: string
                            area:
                              type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /settings/values:
    get:
      operationId: getSettingsValues
      tags: [settings]
      summary: Effective value of every setting readable by the current user
      responses:
        "200":
          description: Key to value
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /settings:
    patch:
      operationId: patchSettings
      tags: [settings]
      summary: Write a batch of settings atomically
      description: >
        Body is a flat object of key to value. Unknown keys, values that fail
        validation and keys the user may not write reject the whole batch. With
        auth disabled personal (scope user) settings have no owner and are refused
        with 400. Turning `auth_enabled` on while `AUTH_SECRET` is weak is refused
        with 400 and `detail.error_code` `auth_secret_insecure`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Applied values
          content:
            application/json:
              schema:
                type: object
        "400":
          description: Invalid request, or a refused value (see SettingsErrorResponse)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /config/download-states:
    get:
      operationId: getDownloadStates
      tags: [config]
      summary: Canonical download states (key, label, tone) for the UI
      security: []
      responses:
        "200":
          description: States
          content:
            application/json:
              schema:
                type: object
                required: [states]
                properties:
                  states:
                    type: array
                    description: Every state, in the canonical order (most advanced first).
                    items:
                      $ref: "#/components/schemas/DownloadStateInfo"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /config/verify-full-sync:
    post:
      operationId: verifyFullSync
      tags: [config]
      summary: Start the probe that checks the sync provider's full-sync mode (admin)
      responses:
        "200":
          description: Task queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskQueued"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /config/verify-full-sync/{task_id}:
    get:
      operationId: getVerifyFullSync
      tags: [config]
      summary: State and result of the full-sync probe (admin)
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Probe state
          content:
            application/json:
              schema:
                type: object
                properties:
                  ready:
                    type: boolean
                  result:
                    type: [object, "null"]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /system/routines:
    get:
      operationId: listRoutines
      tags: [routines]
      summary: System routines with cadence, last run and scheduler health (admin)
      responses:
        "200":
          description: Routines
          content:
            application/json:
              schema:
                type: object
                required: [routines, scheduler_stale]
                properties:
                  routines:
                    type: array
                    items:
                      $ref: "#/components/schemas/RoutineInfo"
                  scheduler_stale:
                    type: boolean
                    description: True when any routine is stale.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /system/routines/{key}:
    patch:
      operationId: patchRoutine
      tags: [routines]
      summary: Enable or disable a routine, or change its interval (admin)
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: boolean
                interval_minutes:
                  type: integer
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /system/routines/{key}/run:
    post:
      operationId: runRoutineNow
      tags: [routines]
      summary: Run a routine now (admin)
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Run started
          content:
            application/json:
              schema:
                type: object
                properties:
                  run_id:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Already queued or running
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  # ════════════════════════════════════════════════════════════════════
  # Download requests: the approval policy
  # ════════════════════════════════════════════════════════════════════
  #
  # A download of a user (not an admin, and not with auth disabled) goes through
  # the approval policy before anything is queued or delegated: each kind of
  # request is approved at once (`auto`), always waits for an admin
  # (`approval`) or is approved at once up to a number of tracks to download
  # (`auto_up_to`), and every user has a quota of tracks per rolling window.
  # Every such request is recorded. Retries of a download that exists are not
  # requests: a retry of a download the user never had is refused.

  /download-requests:
    get:
      operationId: listMyDownloadRequests
      tags: [download-requests]
      summary: The current user's download requests
      description: >
        Newest first. Only requests the approval policy governed are recorded:
        an admin has none.
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: status
          in: query
          description: Repeatable; only requests in one of these states.
          schema:
            type: array
            items:
              $ref: "#/components/schemas/DownloadRequestStatus"
      responses:
        "200":
          description: A page of requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadRequestsPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /download-requests/{request_id}/cancel:
    post:
      operationId: cancelMyDownloadRequest
      tags: [download-requests]
      summary: Cancel the current user's pending request
      description: >
        Nothing was queued and no favorite registered while it waited, so there
        is nothing to undo. Cancelling a request already cancelled answers the
        same with `changed: false`.
      parameters:
        - name: request_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The request, cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadRequestChange"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such request, or somebody else's
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: An admin decided it meanwhile (`request_already_decided`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodedErrorResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /admin/download-requests:
    get:
      operationId: listDownloadRequests
      tags: [admin, download-requests]
      summary: Every user's download requests (admin only)
      description: Newest first, with who asked and who decided.
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: status
          in: query
          description: Repeatable.
          schema:
            type: array
            items:
              $ref: "#/components/schemas/DownloadRequestStatus"
        - name: kind
          in: query
          description: Repeatable.
          schema:
            type: array
            items:
              $ref: "#/components/schemas/DownloadRequestKind"
        - name: user_id
          in: query
          description: Only this requester's requests.
          schema:
            type: string
      responses:
        "200":
          description: A page of requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDownloadRequestsPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /admin/download-requests/pending-count:
    get:
      operationId: getPendingDownloadRequestCount
      tags: [admin, download-requests]
      summary: How many requests wait for an admin (admin only)
      description: One cheap count, for a badge.
      responses:
        "200":
          description: The number of pending requests
          content:
            application/json:
              schema:
                type: object
                required: [pending]
                properties:
                  pending:
                    type: integer
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /admin/download-requests/approve:
    post:
      operationId: approveDownloadRequests
      tags: [admin, download-requests]
      summary: Approve one or many pending requests (admin only)
      description: >
        Each distinct id is approved one after the other and answers its own
        `outcome`; one failing does not stop the others. The request's tracks
        go through the download gate exactly once (an album is handed to an
        external system first, when one takes it), and the favorite on arrival
        is registered now. Two admins approving at once, or an approval racing
        a cancellation, produce one outcome: only the call that moves the
        request out of `pending` queues anything. A request already approved
        is `unchanged`; one denied or cancelled is a `conflict`. When queueing
        fails before any track went in, the request goes back to `pending` and
        its outcome is `failed`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DownloadRequestApprove"
      responses:
        "200":
          description: One outcome per id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadRequestDecisionBatch"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: Invalid body (no ids, more than 100)
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /admin/download-requests/deny:
    post:
      operationId: denyDownloadRequests
      tags: [admin, download-requests]
      summary: Deny one or many pending requests (admin only)
      description: >
        Same answer as the approval. Nothing was queued and no favorite
        registered, so nothing is undone. A request already denied is
        `unchanged`; one approved or cancelled is a `conflict`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DownloadRequestDeny"
      responses:
        "200":
          description: One outcome per id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadRequestDecisionBatch"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: Invalid body (no ids, more than 100)
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /admin/download-policy:
    get:
      operationId: getDownloadPolicy
      tags: [admin, download-requests]
      summary: The general download approval policy (admin only)
      description: >
        The mode and threshold of each kind of request and the per-user quota:
        the settings of the `download_requests` group of the catalogue (they
        also show in GET /settings/schema and GET /settings/values for an
        admin). Defaults: a track `auto`; an album `auto_up_to` 30; a playlist
        and an artist `approval`; `liked_elsewhere` `auto_up_to` 50; a quota of
        200 tracks per 7 days.
      responses:
        "200":
          description: The policy in force
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadPolicy"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    patch:
      operationId: patchDownloadPolicy
      tags: [admin, download-requests]
      summary: Change the general download approval policy (admin only)
      description: >
        Every field is optional. The change goes through the settings
        catalogue: it is validated like any setting and applied all or nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DownloadPolicyPatch"
      responses:
        "200":
          description: The policy now in force
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadPolicy"
        "400":
          description: A refused value (see SettingsErrorResponse)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: Invalid body (unknown field, wrong type or range)
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /admin/users/{user_id}/download-policy:
    get:
      operationId: getUserDownloadPolicy
      tags: [admin, download-requests]
      summary: What an admin changed in a user's download policy (admin only)
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The override and the policy that results from it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDownloadPolicyView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    put:
      operationId: setUserDownloadPolicy
      tags: [admin, download-requests]
      summary: Set a user's download policy override (admin only)
      description: >
        Replaces the user's override: a mode or threshold per kind and their
        own quota; what is missing or null follows the general policy. An empty
        body clears it. A user cannot change their own policy: this route is
        admin-only.
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserDownloadPolicyBody"
      responses:
        "200":
          description: The override now stored and the policy that results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDownloadPolicyView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: Invalid body (unknown kind or mode, a number out of range)
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    delete:
      operationId: clearUserDownloadPolicy
      tags: [admin, download-requests]
      summary: Clear a user's download policy override (admin only)
      description: The user follows the general policy again.
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The (empty) override and the general policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDownloadPolicyView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  # ════════════════════════════════════════════════════════════════════
  # Delegation webhooks
  # ════════════════════════════════════════════════════════════════════

  /delegation/webhook/{provider_name}:
    post:
      operationId: delegationWebhook
      tags: [delegation]
      summary: Push from an external download system (also under /api)
      description: >
        Authenticated by the shared webhook token, compared in constant time;
        refused when no token is configured or the feature is disabled. The
        payload is data, never instructions.
      security:
        - DelegationToken: []
      parameters:
        - name: provider_name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Event accepted or ignored
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /delegation/register-webhook:
    post:
      operationId: registerDelegationWebhooks
      tags: [delegation]
      summary: Register musizerr's webhook on every download provider that supports it (admin)
      responses:
        "200":
          description: One result per provider
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        provider:
                          type: string
                        label:
                          type: string
                        ok:
                          type: boolean
                        detail:
                          type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
