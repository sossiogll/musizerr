        requester.
        The tracks of `playlist` carry the state the request produced
        (`download_status`, `in_library`, `favorite`, `favorite_pending`,
        `playback`).
        Download approval policy: for a user (not an admin, and not with auth
        disabled) the request first goes through the policy
        (see GET /admin/download-policy). Approved at once, it behaves as
        described here; if it waits for an admin it answers 202
        `pending_approval` and nothing is queued, delegated or marked as a
        favorite until an admin approves it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DownloadBody"
      responses:
        "200":
          description: Download enqueued
          content:
            application/json:
              schema:
                type: object
                required: [download_ids, playlist, total_tracks]
                properties:
                  download_ids:
                    type: array
                    items:
                      type: string
                  playlist:
                    $ref: "#/components/schemas/Playlist"
                  total_tracks:
                    type: integer
                    description: Tracks queued (skipped ones excluded)
                  skipped:
                    type: integer
                    description: Tracks left out because already in the library (only_missing)
        "202":
          description: >
            The request waits for an admin (approval policy): nothing was
            queued, delegated or marked as a favorite. It is in GET /download-requests.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadPendingApproval"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          $ref: "#/components/responses/ProviderFailed"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  # ════════════════════════════════════════════════════════════════════
  # Configuration
  # ════════════════════════════════════════════════════════════════════

  /providers:
    get:
      operationId: listProviders
      tags: [config]
      summary: List all registered providers with config values and auth status
      responses:
        "200":
          description: Providers grouped by category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProvidersResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /providers/{name}/accounts/{account_name}:
    delete:
      operationId: deleteProviderAccount
      tags: [config]
