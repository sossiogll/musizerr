openapi: 3.1.0
info:
  title: Musizerr
  description: >
    Self-hosted, provider-agnostic music manager API.
    All provider references (metadata, download, storage, sync, lyrics) are
    dynamic — discovered at runtime via a plugin registry.


    Failures that are not the host's fault never answer 500. A detail route
    whose provider fails answers 502 (the provider answered with an error or
    refused the credentials) or 503 (unreachable, too slow, rate-limited or
    not configured; retryable, with Retry-After), with
    `detail.error_code` = `<subject>_<kind>`. A route that aggregates several
    providers answers 200 with what succeeded and lists the providers that
    failed in `provider_errors`, so a client can say the results may be
    incomplete. Any route may answer 503 `database_busy` (retryable) while
    the database is locked by a long write or a conflicting transaction.
  version: 1.0.0
  license:
    name: MIT

servers:
  - url: /api
    description: "Behind the bundled reverse proxy: the API lives under the public prefix (PUBLIC_API_PREFIX, default /api)"
  - url: http://localhost:8000
    description: Local development (backend direct)

tags:
  - name: user-auth
    description: User registration, login, JWT token management
  - name: admin
    description: Admin-only user management
  - name: auth
    description: Provider authentication (OAuth2, API key, credentials)
  - name: search
    description: Cross-provider content search
  - name: track
    description: Track metadata, lyrics, download
  - name: album
    description: Album metadata and download
  - name: artist
    description: Artist metadata, albums, download
  - name: playlist
    description: Playlist metadata and download
  - name: playlists
    description: >
      The user's own playlists (kept by Musizerr, private), the ones followed from a
      metadata provider, and their copies on the sync providers
  - name: config
    description: Application and provider configuration
  - name: sources
    description: Sources of providers (catalogs version 2), what is installed from them, and the provider gateway state
  - name: history
    description: Download history and retry
  - name: download-requests
    description: >
      Download approval policy: the requests of users that wait for an admin,
      their decisions, and the general and per-user policy
  - name: stream
    description: Audio streaming and playback info
  - name: system
    description: Health check and SSE progress stream
  - name: discover
    description: New releases and trending content (public showcase)
  - name: library
    description: Synced library, library sync and duplicate detection
  - name: settings
    description: Unified settings schema and values
  - name: routines
    description: Periodic system routines (admin)
  - name: delegation
    description: Inbound webhooks from external download systems
  - name: external-utility
    description: Intake of the accounts an external capture utility sends for a provider (admin-only)

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        JWT access token obtained via POST /auth/account/login.
        Required only when auth_enabled is true in app config.
    StreamCookie:
      type: apiKey
      in: cookie
      name: musizerr_stream_token
      description: >
        Short-lived stream token set as an HttpOnly cookie by
        POST /auth/account/stream-session, for the full-audio routes and the
        progress stream (an <audio> element or an EventSource cannot send a
        bearer header). A bearer access token is also accepted there, for API
        clients.
    DelegationToken:
      type: apiKey
      in: query
      name: token
      description: Shared webhook token (setting delegation_webhook_token), compared in constant time.

  schemas:
    # ── Reusable primitives ─────────────────────────────────────────
    DownloadStatus:
      type: string
      description: State of a download (core.download_states), most advanced first.
      enum: [downloaded, dispatched, importing, downloading, conflict, retrying, pending, failed]

    SettingDefinition:
      type: object
      required: [key, type, group, area, label, description, label_key, description_key, provider_capability,
                 admin_only, scope, options, minimum, maximum, step, secret, provider_category, required, hidden,
                 option_label_keys, confirm, visible_when]
      properties:
        key:
          type: string
        type:
          type: string
          enum: [bool, int, float, string, enum, list, provider_ref]
        group:
          type: string
        area:
          type: string
        label:
          type: string
          description: Fallback text.
        description:
          type: string
          description: Fallback text.
        label_key:
          type: string
          description: Translation key of the label (settings.labels.<key>).
        description_key:
          type: string
          description: Translation key of the description (settings.descriptions.<key>).
        provider_capability:
          type: [string, "null"]
          description: >-
            The provider capability (musizerr_sdk.capabilities) the setting acts through; the UI lists the
            providers that declare it (ProviderInfo.capabilities).
        admin_only:
          type: boolean
        scope:
          type: string
          enum: [system, user, system_with_user_override]
        options:
          type: [array, "null"]
          items:
            type: string
        option_label_keys:
          type: [array, "null"]
          description: Translation key of each option (settings.options.<key>.<value>), in the order of options.
          items:
            type: string
        minimum:
          type: [number, "null"]
        maximum:
          type: [number, "null"]
        step:
          type: [number, "null"]
        secret:
          type: boolean
        provider_category:
          type: [string, "null"]
        required:
          type: boolean
        hidden:
          type: boolean
          description: Edited on its own page, not in the generic settings UI.
        confirm:
          description: Choosing `value` asks for an explicit confirmation first.
          oneOf:
            - type: "null"
            - type: object
              required: [value, message_key, message]
              properties:
                value: {}
                message_key:
                  type: string
                  example: settings.confirm.auth_enabled
                message:
                  type: string
                  description: Fallback text.
        visible_when:
          type: [array, "null"]
          description: Pairs [other key, required value]; all must hold for the setting to show.
          items:
            type: array
        available:
          type: boolean
        unavailable_reason:
          type: [string, "null"]

    DownloadPhase:
      type: string
      enum: [queued, active, done, failed, review]

    DownloadStateInfo:
      type: object
      required: [key, label, label_key, tone, phase]
      properties:
        key:
          $ref: "#/components/schemas/DownloadStatus"
        label:
          type: string
          description: Fallback text; the UI translates label_key.
        label_key:
          type: string
          example: download_states.pending
        tone:
          type: string
          enum: [neutral, info, success, warning, danger]
        phase:
          allOf:
            - $ref: "#/components/schemas/DownloadPhase"
          description: >
            What the user can do: queued (waiting), active (being fetched or
            imported), done (in the library), failed (can be retried), review
            (needs a decision).

    Identifier:
      type: object
      required: [type, value]
      properties:
        type:
          type: string
          description: >
            Identifier type. Universal types: `isrc`, `mbid`.
            Provider-specific: stored as `{provider}_id` (e.g. `catalog_id`).
          examples: ["isrc", "mbid", "catalog_id"]
        value:
          type: string
        provider:
          type: [string, "null"]

    ArtistRef:
      type: object
      required: [name, provider, provider_id]
      properties:
        name:
          type: string
        provider:
          type: string
        provider_id:
          type: string

    AlbumRef:
      type: object
      required: [name, provider, provider_id]
      properties:
        name:
          type: string
        provider:
          type: string
        provider_id:
          type: string

    # ── Domain models (serialized) ──────────────────────────────────
    Track:
      type: object
      required: [kind, internal_id, title, artist, album, duration_ms, provider, provider_id]
      properties:
        kind:
          type: string
          enum: [track]
        internal_id:
          type: string
          format: uuid
        title:
          type: string
        artist:
          type: string
        album:
          type: string
        duration_ms:
          type: integer
        cover_url:
          type: [string, "null"]
        preview_url:
          type: [string, "null"]
        stream_url:
          type: [string, "null"]
        provider:
          type: string
        provider_id:
          type: string
        artist_provider_id:
          type: string
        album_provider_id:
          type: string
        track_number:
          type: [integer, "null"]
          description: Position in the album, when the provider knows it.
        disc_number:
          type: [integer, "null"]
        download_status:
          type: [string, "null"]
          description: >
            The FILE state of this track (core download states), decided by the
            server on responses that annotate it: `downloaded` means "in the
            library" by any source (a download landed, a file on the storage
            found by the library scan, or a copy indexed by the sync provider);
            otherwise the aggregate of its download attempts; null if it was
            never requested and is not in the library.
        in_library:
          type: boolean
          description: The file is ours (`download_status == downloaded`), wherever it is stored.
        library_id:
          type: [string, "null"]
          description: >
            Id of the track in the database (the one the favorites routes take),
            when the server knows it.
        favorite:
          type: boolean
          description: One of the viewer's favorites (always false for a guest).
        favorite_pending:
          type: boolean
          description: >
            A download the viewer asked for will add it to their favorites when it
            arrives, and that download is queued or running (false once it failed:
            the intent is kept for the retry).
        playback:
          $ref: "#/components/schemas/Playback"
        year:
          type: [integer, "null"]
        providers:
          type: array
          items:
            type: string
        external_ids:
          type: array
          items:
            $ref: "#/components/schemas/Identifier"
        albums:
          type: array
          items:
            $ref: "#/components/schemas/AlbumRef"
        artists:
          type: array
          items:
            $ref: "#/components/schemas/ArtistRef"
        provider_errors:
          description: >
            Only on this object's own detail response: providers that failed,
            timed out or were skipped while cross-enriching it within the
            enrichment budget (the object is then less complete).
          $ref: "#/components/schemas/ProviderErrors"

    Playback:
      type: object
      description: >
        What the viewer can play of the track, decided by the server. `full`
        plays `stream_url`: from the library (`/stream/{library_id}`) or from a
        metadata provider that declares full-track streaming; `preview` plays
        `preview_url`; `none` nothing. `stream_url` is null unless the type is
        `full`.
      required: [type, source]
      properties:
        type:
          type: string
          enum: [full, preview, none]
        source:
          type: [string, "null"]
          enum: [library, provider, null]

    FavoritesSummary:
      type: object
      description: The viewer's favorites among the collection's tracks that are in the library.
      required: [favorite, addable]
      properties:
        favorite:
          type: integer
          description: Tracks in the library that are already favorites.
        addable:
          type: integer
          description: Tracks in the library that are not favorites yet (what "Add to favorites" adds).

    Album:
      type: object
      required: [kind, internal_id, title, artist, provider, provider_id]
      properties:
        kind:
          type: string
          enum: [album]
        internal_id:
          type: string
          format: uuid
        title:
          type: string
        artist:
          type: string
        year:
          type: [integer, "null"]
        album_type:
          type: [string, "null"]
          enum: [album, single, ep, compilation, live, appears_on, null]
        track_count:
          type: [integer, "null"]
        cover_url:
          type: [string, "null"]
        provider:
          type: string
        provider_id:
          type: string
        artist_provider_id:
          type: string
        providers:
          type: array
          items:
            type: string
        external_ids:
          type: array
          items:
            $ref: "#/components/schemas/Identifier"
        artists:
          type: array
          items:
            $ref: "#/components/schemas/ArtistRef"
        tracks:
          type: array
          items:
            $ref: "#/components/schemas/Track"
        editions:
          type: array
          description: Only in an artist discography — every edition of this release.
          items:
            $ref: "#/components/schemas/AlbumEdition"
        library:
          $ref: "#/components/schemas/LibraryCoverage"
          description: >
            Album detail: the coverage of its tracks (same state as each row's
            `download_status`). Home cards and discography entries: computed
            from the database with the same library definition.
        favorites:
          $ref: "#/components/schemas/FavoritesSummary"
        enrichment:
          $ref: "#/components/schemas/Enrichment"
        provider_errors:
          description: >
            Only on this object's own detail response: providers that failed,
            timed out or were skipped while cross-enriching it within the
            enrichment budget (the object is then less complete).
          $ref: "#/components/schemas/ProviderErrors"

    Artist:
      type: object
      required: [kind, internal_id, name, provider, provider_id]
      properties:
        kind:
          type: string
          enum: [artist]
        internal_id:
          type: string
          format: uuid
        name:
          type: string
        provider:
          type: string
        provider_id:
          type: string
        cover_url:
          type: [string, "null"]
        providers:
          type: array
          items:
            type: string
        external_ids:
          type: array
          items:
            $ref: "#/components/schemas/Identifier"
        provider_errors:
          description: >
            Only on this object's own detail response: providers that failed,
            timed out or were skipped while cross-enriching it within the
            enrichment budget (the object is then less complete).
          $ref: "#/components/schemas/ProviderErrors"
        discography_downloadable:
          type: boolean
          description: >
            Only on this object's own detail response: whether POST
            /download/artist can gather this artist's whole discography from
            its provider (the provider declares the `discography` capability:
            it lists an artist's releases and gives each release's tracks). The
            UI offers "download everything" only when true.

    Playlist:
      type: object
      required: [kind, internal_id, name, provider, provider_id]
      properties:
        kind:
          type: string
          enum: [playlist]
        internal_id:
          type: string
          format: uuid
        name:
          type: string
        provider:
          type: string
        provider_id:
          type: string
        description:
          type: string
        cover_url:
          type: [string, "null"]
        tracks:
          type: array
          items:
            $ref: "#/components/schemas/Track"
        track_count:
          type: [integer, "null"]
          description: Tracks declared by the provider, when it knows.
        tracks_unavailable:
          anyOf:
            - $ref: "#/components/schemas/TracksUnavailable"
            - type: "null"
          description: Set when the tracks cannot be read — never an empty list without a reason.
        library:
          $ref: "#/components/schemas/LibraryCoverage"
        favorites:
          $ref: "#/components/schemas/FavoritesSummary"

    LikedElsewhereTrack:
      description: >
        A Track the user liked on another provider that no track of the
        library matched: "liked elsewhere, not in library".
      allOf:
        - $ref: "#/components/schemas/Track"
        - type: object
          required: [saved_at, provider_saved_at]
          properties:
            saved_at:
              type: string
              format: date-time
              description: Earliest time any provider saved it.
            provider_saved_at:
              type: object
              description: Per provider that has it liked (key = provider name).
              additionalProperties:
                type: object
                required: [added_at]
                properties:
                  added_at:
                    type: [string, "null"]
                    format: date-time

    FavoriteTrack:
      description: A favorite of the user (always a track in the library).
      allOf:
        - $ref: "#/components/schemas/Track"
        - type: object
          required: [favorited_at]
          properties:
            favorited_at:
              type: string
              format: date-time

    FavoriteChange:
      type: object
      required: [track_id, favorite, changed]
      properties:
        track_id:
          type: string
        favorite:
          type: boolean
          description: The state after the call.
        changed:
          type: boolean
          description: False when it already was in that state (the call is idempotent).

    Lyrics:
      type: object
      properties:
        plain:
          type: [string, "null"]
        synced:
          type: array
          items:
            type: object
            required: [time_ms, text]
            properties:
              time_ms:
                type: integer
              text:
                type: string
        source:
          type: string

    # ── Auth schemas ────────────────────────────────────────────────
    # ── Detail view additions ───────────────────────────────────────
    LibraryCoverage:
      type: object
      description: Server-computed library coverage of a collection (core download states).
      required: [total, downloaded, in_progress, failed]
      properties:
        total:
          type: [integer, "null"]
          description: >
            Tracks of the collection; null when no source knows how many the
            release has (a discography or Home tile): "N in the library".
        downloaded:
          type: integer
        in_progress:
          type: integer
        failed:
          type: integer

    AlbumEdition:
      type: object
      required: [provider, provider_id, title]
      properties:
        provider:
          type: string
        provider_id:
          type: string
        title:
          type: string
        year:
          type: [integer, "null"]
        album_type:
          type: [string, "null"]
        track_count:
          type: [integer, "null"]
        cover_url:
          type: [string, "null"]
        external_ids:
          type: array
          items:
            $ref: "#/components/schemas/Identifier"

    TracksUnavailable:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [access_restricted, error]
        message:
          type: string

    Enrichment:
      type: object
      description: Outcome of the cross-provider enrichment of an album detail.
      required: [complete]
      properties:
        complete:
          type: boolean
        reason:
          type: [string, "null"]
          enum: [provider_error, track_error, null]

    ErrorInfo:
      type: object
      description: >
        Error shown to a non-admin: a stable code and a readable message. The raw
        infrastructure error is added as error_detail for admins only.
      properties:
        error_code:
          type: [string, "null"]
          example: sync_provider_unreachable
        error_message:
          type: [string, "null"]
        error_detail:
          type: string
          description: Raw error text, admins only.

    ViewerCapabilities:
      type: object
      required: [search, download, download_plain, favorite, stream_full, library, playlists, settings_personal, linked_accounts, admin]
      properties:
        search:
          type: boolean
        download:
          type: boolean
          description: >
            Download a track and add it to your favorites when it arrives (the
            only download a user has).
        download_plain:
          type: boolean
          description: Download without adding to favorites (admins, and auth disabled).
        favorite:
          type: boolean
          description: The heart on a track in the library (like/unlike).
        stream_full:
          type: boolean
        library:
          type: boolean
        playlists:
          type: boolean
          description: The user's own playlists (GET /playlists); on in open mode too (they belong to the instance).
        settings_personal:
          type: boolean
        linked_accounts:
          type: boolean
          description: Connect your own provider accounts (GET /auth/linked-accounts); on in open mode too.
        admin:
          type: boolean

    PublicProviders:
      type: object
      required: [providers, metadata_priority, metadata, metadata_capabilities]
      properties:
        providers:
          type: array
          items:
            type: object
            required: [id, label]
            properties:
              id:
                type: string
              label:
                type: string
        metadata_priority:
          type: array
          description: >
            The viewer's metadata priority: their own when signed in and set,
            otherwise the system one. Only installed providers.
          items:
            type: string
        metadata:
          type: array
          description: Every metadata provider, in the viewer's priority order (the unprioritised last).
          items:
            type: string
        metadata_capabilities:
          type: object
          description: >
            The optional capabilities each metadata provider declares, by
            provider id (the same keys as `capabilities` in GET /providers, e.g.
            `discography`: it can list an artist's releases and give each
            release's tracks). A static declaration of the provider.
          additionalProperties:
            type: array
            items:
              type: string

    AppearsOnRelease:
      type: object
      required: [title, provider, provider_id, track_provider_id]
      properties:
        title:
          type: string
        year:
          type: [integer, "null"]
        provider:
          type: string
        provider_id:
          type: string
        track_provider_id:
          type: string

    TrackList:
      type: object
      required: [items, provider_errors]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Track"
        provider_errors:
          $ref: "#/components/schemas/ProviderErrors"

    TaskQueued:
      type: object
      required: [task_id]
      properties:
        task_id:
          type: string
        status:
          type: string

    LibraryJobProvider:
      type: object
      description: One provider involved in a library job, with its own progress and outcome.
      required: [provider, status, processed, count]
      properties:
        provider:
          type: string
        status:
          type: string
          enum: [queued, running, completed, failed]
        processed:
          type: integer
        total:
          type: [integer, "null"]
          description: null while unknown (e.g. while the likes are read).
        count:
          type: integer
          description: Items this provider added (new likes imported).
        error_code:
          type: [string, "null"]
          example: provider_not_connected
        error_message:
          type: [string, "null"]
          description: Readable message; never the raw error.
        error_detail:
          type: string
          description: Raw error text, admins only.

    LibraryJobRun:
      type: object
      description: >
        One run of a user's library job: `library_sync` (import the likes
        from the providers) or `download_sync` (queue the downloads of the
        likes not in the library). Only kind and status (never_run) before the
        first run. The run is created `queued` when requested, the worker
        moves it to `running` and then to `completed` or `failed`. A run no
        worker will finish becomes `failed` with error_code
        `worker_unavailable` (queued while no worker is alive, or for too
        long) or `worker_lost` (running with no heartbeat for too long, or
        left running by a restarted worker). Progress is generic: a phase key
        (library_sync: fetching, saving; download_sync: preparing, checking),
        the provider being worked on, processed/total of the phase (total
        null = unknown) and one entry per provider.
      required: [kind, status]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [library_sync, download_sync]
        status:
          type: string
          enum: [never_run, queued, running, completed, failed]
        task_id:
          type: [string, "null"]
        params:
          type: object
          description: The job's arguments (download_sync time_range).
          additionalProperties: true
        phase:
          type: [string, "null"]
          enum: [fetching, saving, preparing, checking, null]
        provider:
          type: [string, "null"]
          description: The provider the current phase works on.
        processed:
          type: integer
        total:
          type: [integer, "null"]
        providers:
          type: array
          items:
            $ref: "#/components/schemas/LibraryJobProvider"
        result:
          type: object
          description: >
            Final counts: library_sync {tracks_synced}; download_sync
            {total, checked, queued, errors, skipped_removed} (the likes of
            songs the user took off their favorites are not downloaded). The
            download of the likes is a `liked_elsewhere` download request: when
            the approval policy makes it wait, nothing is queued (`queued` 0)
            and `pending_approval` names the request.
          additionalProperties:
            type: integer
          properties:
            pending_approval:
              type: object
              required: [request_id, needed_tracks, reason]
              properties:
                request_id:
                  type: string
                needed_tracks:
                  type: integer
                reason:
                  type: string
        queued_at:
          type: [string, "null"]
          format: date-time
        started_at:
          type: [string, "null"]
          format: date-time
        heartbeat_at:
          type: [string, "null"]
          format: date-time
          description: Last progress write of the worker.
        completed_at:
          type: [string, "null"]
          format: date-time
        error_code:
          type: [string, "null"]
          description: >
            worker_unavailable, worker_lost, queue_unavailable,
            account_required, provider_not_connected, job_failed, or a
            provider error code (e.g. metadata_provider_unreachable).
          example: worker_unavailable
        error_message:
          type: [string, "null"]
          description: Readable message; never the raw error.
        error_detail:
          type: string
          description: Raw error text, admins only.

    LibraryJobStarted:
      description: The run started, or the one already queued or running.
      allOf:
        - $ref: "#/components/schemas/LibraryJobRun"
        - type: object
          required: [created]
          properties:
            created:
              type: boolean
              description: false when an active run was returned instead of starting another.

    LibraryJobEvent:
      type: object
      description: A library job's progress on /progress, sent to the run's owner only.
      required: [type, user_id, run]
      properties:
        type:
          type: string
          enum: [library_job]
        user_id:
          type: string
        run:
          $ref: "#/components/schemas/LibraryJobRun"

    RoutineRun:
      type: object
      properties:
        queued_at:
          type: string
          format: date-time
          description: When the run was dispatched (put in the queue).
        started_at:
          type: [string, "null"]
          format: date-time
          description: When a worker really started it; null while it waits in the queue, or if it never started.
        finished_at:
          type: [string, "null"]
          format: date-time
        wait_seconds:
          type: [number, "null"]
          description: How long it waited in the queue; null until it starts.
        duration_seconds:
          type: [number, "null"]
          description: How long it executed (the wait excluded); null until it finishes.
        status:
          type: string
          enum: [queued, running, ok, error, skipped]
          description: >
            queued (waiting for a worker), running, ok, error, or skipped (a
            scheduled run whose period another run already covered).
        result:
          type: [object, "null"]
          additionalProperties: true
          description: >
            What the run returned, as data (counts, a status word, one report
            per sync provider for sync_library_index and sync_playlists, the playlists
            looked at for refresh_followed_playlists); the UI renders it per
            routine. A failed run keeps it only when the task recorded its
            failure in it (status "error" with an error_code); null otherwise
            and when the result is not an object.
        detail:
          type: [string, "null"]
          description: A run's result that is not an object, as text.
        error_code:
          type: [string, "null"]
          description: >
            A failed run's stable code: the one its result names (e.g.
            sync_provider_unreachable, sync_provider_partial_listing), else the
            classified text of the failure (routine_<kind>).
        error_message:
          type: string
        error_detail:
          type: [string, "null"]
        progress:
          description: >
            Where a running run of a routine that reports progress is (the
            same keys as a library job's progress); null otherwise.
          anyOf:
            - type: "null"
            - type: object
              properties:
                phase:
                  type: string
                  description: A generic phase key (sync_library_index - listing, indexing, pruning).
                provider:
                  type: [string, "null"]
                processed:
                  type: integer
                total:
                  type: [integer, "null"]
                heartbeat_at:
                  type: [string, "null"]
                  format: date-time
                  description: When the run last reported.

    RoutineInfo:
      type: object
      required: [key, task, enabled, interval_minutes, min_interval_minutes, queued, running, scheduler_stale]
      properties:
        key:
          type: string
        task:
          type: string
        follows:
          type: [string, "null"]
          description: >
            The routine whose end starts this one (match_likes follows
            sync_library_index); the tick does not start it while that one
            waits or runs. Null for a routine that runs only on its period.
        enabled:
          type: boolean
        interval_minutes:
          type: integer
        min_interval_minutes:
          type: integer
        last_run:
          anyOf:
            - $ref: "#/components/schemas/RoutineRun"
            - type: "null"
        next_run_at:
          type: [string, "null"]
          format: date-time
          description: The last real start plus the interval; null if it never started (due now).
        queued:
          type: boolean
          description: A run waits in the queue for a worker.
        running:
          type: boolean
          description: A run is executing now.
        scheduler_stale:
          type: boolean
          description: Enabled and its next run is more than five minutes overdue (worker or beat down).
        active_work:
          type: [integer, "null"]
          description: >
            Work the routine set going that is still in progress (tasks it
            queued, chains it resumed), e.g. the likes syncs queued or running;
            null for a routine that leaves none behind.

    DuplicateMember:
      type: object
      properties:
        id:
          type: string
        sync_id:
          type: string
        path:
          type: string
          description: >
            The path the sync provider shows for the file. Often virtual
            (rebuilt from the tags): two different files can share it.
        storage_path:
          type: [string, "null"]
          description: >
            Where the file really is on the storage, when Musizerr knows it
            (the download the member is linked to); null otherwise.
        added_at:
          type: [string, "null"]
          format: date-time
          description: When the linked Musizerr download landed; null when unknown.
        downloaded_via:
          type: [string, "null"]
          description: The download provider of the linked Musizerr download.
        title:
          type: string
        artist:
          type: string
        album:
          type: string
        year:
          type: [integer, "null"]
        duration_ms:
          type: [integer, "null"]
        size:
          type: [integer, "null"]
        suffix:
          type: [string, "null"]
        bitrate:
          type: [integer, "null"]
        sample_rate:
          type: [integer, "null"]
        lossless:
          type: [boolean, "null"]
        quality_known:
          type: boolean
        best_quality:
          type: boolean
          description: >
            This file's quality beats every other one of the group (a hint
            for choosing by hand; false for all when a quality is unknown or
            the best ones tie).
        stream_url:
          type: [string, "null"]
          description: >
            Plays THIS file (`/library/duplicates/members/{member_id}/stream`,
            admin); null once the file was deleted.
        fingerprint_score:
          type: [number, "null"]
        origin:
          type: string
        deletable:
          type: boolean
        is_keeper:
          type: boolean
        deleted_at:
          type: [string, "null"]
          format: date-time

    DuplicateGroup:
      type: object
      properties:
        id:
          type: string
        recording_id:
          type: string
        status:
          type: string
          enum: [proposed, needs_review, resolved, dismissed]
        reason:
          type: [string, "null"]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        resolved_at:
          type: [string, "null"]
          format: date-time
        deleted_paths:
          type: array
          items:
            type: string
        members:
          type: array
          items:
            $ref: "#/components/schemas/DuplicateMember"

    RegisterBody:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
        email:
          type: [string, "null"]

    LoginBody:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    RefreshBody:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string

    TokenResponse:
      type: object
      required: [access_token, refresh_token, token_type]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          default: bearer

    UserPublic:
      type: object
      required: [id, username, role, is_active]
      properties:
        id:
          type: string
        username:
          type: string
        email:
          type: [string, "null"]
        role:
          type: string
          enum: [admin, user]
        is_active:
          type: boolean
        pending_approval:
          type: boolean
          description: >-
            Created by a sign-in through a provider while the policy `provider_login_new_accounts` is
            `pending`: inactive until an admin activates it (PATCH /admin/users/{user_id} with
            `is_active: true`).

    UserPatch:
      type: object
      properties:
        role:
          type: string
          enum: [admin, user]
        is_active:
          type: boolean
        password:
          type: string

    # ── Content request schemas ─────────────────────────────────────
    ExternalIdBody:
      type: object
      required: [type, value]
      properties:
        type:
          type: string
        value:
          type: string

    DownloadBody:
      type: object
      required: [provider, id]
      properties:
        provider:
          type: string
        id:
          type: string
        external_ids:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/ExternalIdBody"
        only_missing:
          type: boolean
          default: false
          description: >
            Album and playlist only: download only the missing tracks, skipping
            those in the library or already on their way (the file state the
            library coverage counts; failed ones are missing).
        add_to_favorites:
          type: [boolean, "null"]
          description: >
            Admins (and auth disabled) only: add the tracks to your favorites
            when they arrive; default false (a plain download). A user's
            download ALWAYS adds them: this field cannot turn that off.
        force:
          type: boolean
          default: false
          description: >
            Track only, admins only (403 otherwise): download again a track
            already in the library. Without it a track in the library is never
            downloaded twice.
        release_types:
          type: [array, "null"]
          minItems: 1
          items:
            type: string
            enum: [album, single, ep, compilation, live, appears_on]
          description: >
            Artist only: which kinds of release make the discography. Default
            (omitted or null): `album`, `single` and `ep`, the artist's own
            releases; compilations, live recordings and `appears_on` (the
            releases of others the artist is on) are taken only when named. A
            release whose provider gives no type counts as an `album`. Another
            value is a 422.

    # ── Provider auth schemas ───────────────────────────────────────
    ApiKeyBody:
      type: object
      required: [api_key]
      properties:
        api_key:
          type: string

    OAuthClientBody:
      type: object
      required: [client_id, client_secret]
      properties:
        client_id:
          type: string
        client_secret:
          type: string

    CredentialsBody:
      type: object
      description: >-
        One string per field of the provider's login form (`credential_fields`: its
        `key`s, all required, no other).
      additionalProperties:
        type: string

    AccountModel:
      type: string
      enum: [none, personal, personal_with_shared, system]
      description: >-
        Whose account the provider is used with, declared by the provider. `none`: no account.
        `personal`: each user's own, never a shared one. `personal_with_shared`: a user may connect
        their own; the instance also has a shared one (managed by an admin) that serves who has
        none and the host's jobs. `system`: only the instance's, managed by an admin.

    AccountTarget:
      type: string
      enum: [personal, shared]
      description: The account a write is about, the caller's own or the instance's shared one (admins only).

    CredentialField:
      type: object
      required: [key, label, secret]
      properties:
        key:
          type: string
        label:
          type: string
        secret:
          type: boolean
          description: A secret field is never shown back.

    PersonalAccountState:
      type: object
      required: [connected, username, missing_permissions, capabilities, login]
      properties:
        login:
          type: [boolean, "null"]
          description: >-
            Whether the caller can sign in through this account. null when the provider cannot sign
            anybody in (no `login` capability); false when it can and this account carries no id from
            the provider yet (not connected, or linked before sign-in existed: reconnect it).
        connected:
          type: boolean
          description: The caller connected their own account.
        username:
          type: [string, "null"]
          description: Who the own account is, for a login account.
        missing_permissions:
          type: array
          description: >-
            The capabilities the own connection was not granted the permission for (connected before
            the provider asked for it); reconnecting grants them.
          items:
            type: string
        capabilities:
          type: array
          description: What an own account enables, declared by the provider (musizerr_sdk.capabilities).
          items:
            type: string

    LoginProvider:
      type: object
      required: [name, label, auth_flow, credential_fields]
      properties:
        name:
          type: string
        label:
          type: string
        auth_flow:
          type: string
          enum: [oauth2, credentials]
          description: >-
            `oauth2`: the browser is sent to GET /auth/account/login/{provider}/start. `credentials`: the
            form in `credential_fields` is posted to POST /auth/account/login/{provider}/credentials.
        credential_fields:
          type: array
          description: The form of a login account (empty for `oauth2`).
          items:
            $ref: "#/components/schemas/CredentialField"

    LoginCodeBody:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: The one-time code the sign-in callback sent the browser back with.

    SharedAccountState:
      type: object
      required: [connected, username]
      properties:
        connected:
          type: boolean
          description: The instance has an account of its own on the provider.
        username:
          type: [string, "null"]
          description: Who the shared account is; admins only, null for everyone else.

    LinkedAccount:
      type: object
      required: [name, label, auth_flow, account_model, connectable, credential_fields, personal, shared]
      properties:
        name:
          type: string
        label:
          type: string
        auth_flow:
          type: string
          enum: [oauth2, credentials]
        account_model:
          $ref: "#/components/schemas/AccountModel"
        connectable:
          type: boolean
          description: False when an admin has not yet configured what a connection needs (the OAuth2 app).
        credential_fields:
          type: array
          description: The login form of a `credentials` account; empty for OAuth2.
          items:
            $ref: "#/components/schemas/CredentialField"
        personal:
          $ref: "#/components/schemas/PersonalAccountState"
        shared:
          description: Present when the instance has an account that serves users who have none.
          oneOf:
            - $ref: "#/components/schemas/SharedAccountState"
            - type: "null"

    # ── Config / Provider info ──────────────────────────────────────
    ProviderInfo:
      type: object
      required: [name, label, auth_flow, account_model, personal, shared, authenticated, usable, config, config_valid, also_registered_in]
      properties:
        name:
          type: string
        label:
          type: string
        auth_flow:
          type: string
          enum: [none, oauth2, api_key, credentials, external_utility]
        authenticated:
          type: boolean
        usable:
          type: boolean
          description: Logged in (when it needs to be) and its saved configuration is complete.
        account_model:
          $ref: "#/components/schemas/AccountModel"
        personal:
          description: The caller's own account; null when the model has no personal accounts.
          oneOf:
            - $ref: "#/components/schemas/PersonalAccountState"
            - type: "null"
        shared:
          description: The instance's shared account; null when the model has none.
          oneOf:
            - $ref: "#/components/schemas/SharedAccountState"
            - type: "null"
        client_id:
          type: string
          description: Present for OAuth2 providers when configured
        credential_fields:
          type: array
          description: Present for credentials providers — the fields of the login form.
          items:
            $ref: "#/components/schemas/CredentialField"
        accounts:
          type: array
          description: Present for external_utility providers
          items:
            type: object
            required: [name]
            properties:
              name:
                type: string
            additionalProperties:
              type: string
              description: One value per account_display_fields key.
        account_display_fields:
          type: array
          description: external_utility providers — account fields to show, in order.
          items:
            type: object
            required: [key, label]
            properties:
              key:
                type: string
              label:
                type: string
        borrowed_oauth_client_from:
          type: string
          description: external_utility providers that reuse another provider's OAuth client.
        borrowed_oauth_client_ok:
          type: boolean
          description: Whether that provider has an OAuth client configured.
        library_package:
          type: string
          description: external_utility providers — the optional package the provider needs.
        library_url:
          type: string
        library_available:
          type: boolean
          description: Whether that package is installed; absent for providers that need none.
        disclaimer:
          type: string
        setup_command:
          type: string
        setup_instructions:
          type: string
        config:
          type: object
          description: Saved configuration (system scope), admins only; empty for everyone else.
          additionalProperties: true
        config_valid:
          type: boolean
          description: Whether the saved configuration is complete.
        also_registered_in:
          type: array
          description: Other categories where this same provider object is registered.
          items:
            type: string
        capabilities:
          type: array
          description: >-
            Metadata providers — the optional capabilities it declares (musizerr_sdk.capabilities),
            e.g. user_library, unlike_saved_track.
          items:
            type: string

    ProvidersResponse:
      type: object
      required: [metadata, download, lyrics, storage, sync, identification]
      properties:
        metadata:
          type: array
          items:
            $ref: "#/components/schemas/ProviderInfo"
        download:
          type: array
          items:
            $ref: "#/components/schemas/ProviderInfo"
        lyrics:
          type: array
          items:
            $ref: "#/components/schemas/ProviderInfo"
        storage:
          type: array
          items:
            $ref: "#/components/schemas/ProviderInfo"
        sync:
          type: array
          items:
            $ref: "#/components/schemas/ProviderInfo"

    # ── Sources ─────────────────────────────────────────────────────
        identification:
          type: array
          items:
            $ref: "#/components/schemas/ProviderInfo"
    ProviderSource:
      type: object
      required: [id, name, url, enabled, added_at, has_credential, allow_insecure_registry]
      properties:
        id:
          type: string
        name:
          type: string
          description: The name the catalog gave itself when the source was added
        url:
          type: string
          format: uri
        enabled:
          type: boolean
        added_at:
          type: string
          format: date-time
        has_credential:
          type: boolean
          description: A token is set. The token itself is never returned.
        allow_insecure_registry:
          type: boolean
          description: The gateway may speak plain HTTP to the image registry of this source's providers

    AddSourceRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
        credential:
          type: [string, "null"]
          description: >
            A token with read access to a private catalog and its images (a GitHub token).
            Stored encrypted at rest, like provider credentials (docs/credentials.md); never returned.
        allow_insecure_registry:
          type: boolean
          default: false

    EditSourceRequest:
      type: object
      properties:
        enabled:
          type: boolean
        credential:
          type: [string, "null"]
          description: A new token; null removes it
        allow_insecure_registry:
          type: boolean

    SourceRemoved:
      type: object
      required: [ok, uninstalled]
      properties:
        ok:
          type: boolean
          const: true
        uninstalled:
          type: array
          items:
            type: string

    InstallRequest:
      type: object
      required: [source_id, provider_name, digest]
      properties:
        source_id:
          type: string
        provider_name:
          type: string
        digest:
          type: string
          description: The digest the admin was shown (sha256:...); refused if the catalog offers another
          pattern: "^sha256:[0-9a-f]{64}$"

    UpdateProviderRequest:
      type: object
      required: [digest]
      properties:
        digest:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"

    ProviderPermissions:
      type: object
      description: What the sandbox of a provider is granted (the form of the image labels)
      required: [egress, egress_from_settings, filesystem_from_settings, tcp_from_settings, limits]
      properties:
        egress:
          type: array
          items:
            type: string
            description: "host:port; the host may be a wildcard (*.example.com:443 = any subdomain of example.com, not example.com itself)"
        egress_from_settings:
          type: array
          description: Keys of the provider's settings whose value (a URL or host the user types) becomes reachable
          items:
            type: string
        filesystem_from_settings:
          type: array
          items:
            type: object
            required: [setting, mode]
            properties:
              setting:
                type: string
              mode:
                type: string
                enum: [ro, rw]
        tcp_from_settings:
          type: array
          description: Settings whose value names a host the provider may open raw TCP connections to (FTP), on the ports declared
          items:
            $ref: "#/components/schemas/TcpAccess"
        limits:
          type: object
          properties:
            memory_mb:
              type: [integer, "null"]
            open_files:
              type: [integer, "null"]
            processes:
              type: [integer, "null"]

    PermissionsDiff:
      type: object
      description: What an update changes in what the admin approved
      required: [egress, egress_from_settings, filesystem_from_settings, tcp_from_settings, limits, roles, is_empty, grants_more]
      properties:
        egress:
          $ref: "#/components/schemas/AddedRemovedStrings"
        egress_from_settings:
          $ref: "#/components/schemas/AddedRemovedStrings"
        filesystem_from_settings:
          type: object
          required: [added, removed]
          properties:
            added:
              type: array
              items:
                $ref: "#/components/schemas/FilesystemAccess"
            removed:
              type: array
              items:
                $ref: "#/components/schemas/FilesystemAccess"
        tcp_from_settings:
          type: object
          required: [added, removed]
          properties:
            added:
              type: array
              items:
                $ref: "#/components/schemas/TcpAccess"
            removed:
              type: array
              items:
                $ref: "#/components/schemas/TcpAccess"
        limits:
          type: array
          items:
            type: object
            required: [name, old, new]
            properties:
              name:
                type: string
              old:
                type: [integer, "null"]
              new:
                type: [integer, "null"]
        roles:
          $ref: "#/components/schemas/AddedRemovedStrings"
        is_empty:
          type: boolean
        grants_more:
          type: boolean
          description: It asks for something new (a host or a wildcard, a raw-TCP host, a path, a role, a larger limit)

    AddedRemovedStrings:
      type: object
      required: [added, removed]
      properties:
        added:
          type: array
          items:
            type: string
        removed:
          type: array
          items:
            type: string

    FilesystemAccess:
      type: object
      required: [setting, mode]
      properties:
        setting:
          type: string
        mode:
          type: string
          enum: [ro, rw]

    TcpAccess:
      type: object
      required: [setting, ports]
      properties:
        setting:
          type: string
        ports:
          type: string
          description: "any (1-65535), one port (2121) or a range (30000-30100)"

    CatalogEntry:
      type: object
      required: [name, label, description, homepage, image, registry, digest, provider_api_version, roles, permissions, compatible, incompatibility]
      properties:
        name:
          type: string
        label:
          type: string
        description:
          type: string
        homepage:
          type: [string, "null"]
        image:
          type: string
          description: registry/repository, no tag
        registry:
          type: string
          description: The registry host the gateway pulls from (and sends this source's token to, if it has one)
        digest:
          type: string
        provider_api_version:
          type: integer
        roles:
          type: array
          items:
            type: string
        permissions:
          $ref: "#/components/schemas/ProviderPermissions"
        compatible:
          type: boolean
          description: It implements this Musizerr's provider API version; if not it cannot be installed
        incompatibility:
          type: [string, "null"]

    ProviderUpdateOffer:
      allOf:
        - $ref: "#/components/schemas/CatalogEntry"
        - type: object
          required: [diff]
          properties:
            diff:
              $ref: "#/components/schemas/PermissionsDiff"

    SourceCatalogEntry:
      allOf:
        - $ref: "#/components/schemas/CatalogEntry"
        - type: object
          required: [installed, installed_from_this_source, installed_digest, update]
          properties:
            installed:
              type: boolean
            installed_from_this_source:
              type: boolean
            installed_digest:
              type: [string, "null"]
            update:
              oneOf:
                - $ref: "#/components/schemas/ProviderUpdateOffer"
                - type: "null"

    SourceCatalog:
      type: object
      required: [source, name, entries, rejected]
      properties:
        source:
          $ref: "#/components/schemas/ProviderSource"
        name:
          type: string
        entries:
          type: array
          items:
            $ref: "#/components/schemas/SourceCatalogEntry"
        rejected:
          type: array
          description: Entries that are not valid, with the reason
          items:
            type: object
            required: [name, reason]
            properties:
              name:
                type: string
              reason:
                type: string

    InstalledProvider:
      type: object
      required: [name, label, image, registry, digest, provider_api_version, roles, permissions, source_id, source_name, sends_source_token, approved_at, approved_by, installed_at]
      properties:
        name:
          type: string
        label:
          type: string
        image:
          type: string
        registry:
          type: string
        digest:
          type: string
        provider_api_version:
          type: integer
        roles:
          type: array
          items:
            type: string
        permissions:
          $ref: "#/components/schemas/ProviderPermissions"
        source_id:
          type: string
        source_name:
          type: [string, "null"]
        sends_source_token:
          type: boolean
          description: The gateway uses the source's token to pull this image
        approved_at:
          type: string
          format: date-time
        approved_by:
          type: [string, "null"]
          description: The admin who approved it; null when approved from the host's shell
        installed_at:
          type: string
          format: date-time
        update:
          oneOf:
            - $ref: "#/components/schemas/ProviderUpdateOffer"
            - type: "null"
          description: Present with `updates` (the default); null when the catalog offers nothing newer
        update_error:
          type: [string, "null"]
          description: Why the update could not be looked at (an error code of the catalog fetch, `source_disabled`, `provider_not_in_catalog`)

    GatewayProviderState:
      type: object
      required: [name, state, reason, restarts, roles]
      properties:
        name:
          type: string
        state:
          type: string
          enum: [pulling, starting, running, restarting, refused, unavailable, failed, stopped]
        reason:
          type: string
        restarts:
          type: integer
        roles:
          type: array
          items:
            type: string

    ProviderGatewayState:
      type: object
      required: [reachable, status, detail, deployed, sandbox, providers, rejected, host_rejected]
      properties:
        reachable:
          type: boolean
        status:
          type: string
          enum: [ok, degraded, unavailable, unreachable]
        detail:
          type: string
        deployed:
          type: boolean
        sandbox:
          type: [object, "null"]
          properties:
            available:
              type: [boolean, "null"]
            reason:
              type: string
        providers:
          type: array
          items:
            $ref: "#/components/schemas/GatewayProviderState"
        rejected:
          type: object
          additionalProperties:
            type: string
        host_rejected:
          type: object
          additionalProperties:
            type: string

    SourceErrorResponse:
      type: object
      required: [detail]
      properties:
        detail:
          type: object
          required: [error_code, error_message]
          properties:
            error_code:
              type: string
            error_message:
              type: string

    # ── Downloads / History ─────────────────────────────────────────
    DownloadAttempt:
      type: object
      required: [download_id, status, provider_used, file_path, error_code, error_message, retry_count, started_at, completed_at]
      properties:
        download_id:
          type: string
        status:
          $ref: "#/components/schemas/DownloadStatus"
        provider_used:
          type: [string, "null"]
        file_path:
          type: [string, "null"]
        error_code:
          type: [string, "null"]
          description: >
            `download_provider_<kind>` for a failure of a provider, or
            `queue_unavailable` for a download that could not be handed to the
            task queue (the broker was down): it failed before any worker saw
            it, is retriable, and the transient-failure routine queues it again.
          example: download_provider_unreachable
        error_message:
          type: [string, "null"]
          description: Readable message; never the raw error.
        error_detail:
          type: string
          description: Raw error text, admins only.
        retry_count:
          type: integer
        started_at:
          type: [string, "null"]
          format: date-time
        completed_at:
          type: [string, "null"]
          format: date-time

    TrackDownload:
      type: object
      required: [track_id, status, provider_used, file_path, requested_by, track, attempts]
      properties:
        track_id:
          type: string
        status:
          $ref: "#/components/schemas/DownloadStatus"
        provider_used:
          type: [string, "null"]
        file_path:
          type: [string, "null"]
        requested_by:
          type: [string, "null"]
          description: Username of whoever asked for the downloaded (or latest) attempt.
        track:
          $ref: "#/components/schemas/Track"
        attempts:
          type: array
          items:
            $ref: "#/components/schemas/DownloadAttempt"

    DownloadsPage:
      type: object
      required: [items, total, page, limit, pages]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TrackDownload"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
        pages:
          type: integer

    # ── SSE progress event ──────────────────────────────────────────
    ProgressEvent:
      type: object
      required: [download_id, status]
      properties:
        download_id:
          type: string
        status:
          $ref: "#/components/schemas/DownloadStatus"
        track_title:
          type: string
        track_id:
          type: string
        file_state:
          description: >
            The FILE state of the track after this event, decided by the server
            (the same value as a track's `download_status` in any list):
            `downloaded` for a track in the library whatever happens to this
            attempt. A client shows this, never `status` alone.
          oneOf:
            - $ref: "#/components/schemas/DownloadStatus"
            - type: "null"
        phase:
          type: [string, "null"]
          description: The phase of `file_state` (see GET /config/download-states).

    DownloadRequestResult:
      type: object
      required: [status, download_id, library_id]
      description: >
        The outcome of a download request. `already_in_library`: the track is
        in the library, nothing was created or queued (`download_id` null);
        `attached`: it joined the request already open for the track;
        `queued`: a new download was queued.
      properties:
        status:
          type: string
          enum: [queued, attached, already_in_library]
        download_id:
          type: [string, "null"]
        library_id:
          type: string
          description: The id of the track in the library database.

    # ── Download approval policy ────────────────────────────────────
    DownloadRequestKind:
      type: string
      enum: [track, album, playlist, artist, liked_elsewhere]
      description: >
        What was asked for. `liked_elsewhere` is the library job "download the
        likes that are not in the library".

    DownloadRequestStatus:
      type: string
      enum: [pending, approved, denied, cancelled]

    DownloadRequestMode:
      type: string
      enum: [auto, approval, auto_up_to]
      description: >
        `auto`: approved at once. `approval`: always waits for an admin.
        `auto_up_to`: approved at once when the request needs at most
        `threshold` tracks downloaded, otherwise it waits.

    DownloadRequestReason:
      type: string
      enum: [auto, within_threshold, kind_requires_approval, over_threshold, over_quota]
      description: >
        Why the request was approved at once (`auto`: the kind is automatic;
        `within_threshold`) or why it waits (`kind_requires_approval`;
        `over_threshold`; `over_quota`: it would pass the user's quota, which
        applies to every mode). An admin's approval keeps the reason the request
        waited for.

    DownloadPendingApproval:
      type: object
      required: [status, request_id, kind, needed_tracks, reason]
      description: >
        The 202 answer of a download route when the request waits for an admin:
        nothing was queued, delegated or marked as a favorite. The request is
        in GET /download-requests.
      properties:
        status:
          type: string
          enum: [pending_approval]
        request_id:
          type: string
        kind:
          $ref: "#/components/schemas/DownloadRequestKind"
        needed_tracks:
          type: integer
          description: >
            The tracks that need a download (never the ones already in the
            library or with an open download the request would join).
        reason:
          type: string
          enum: [kind_requires_approval, over_threshold, over_quota]

    DownloadRequest:
      type: object
      required: [id, kind, status, auto, reason, target, title, subtitle, cover_url, needed_tracks, queued_tracks,
                 dispatched_to, add_to_favorites, decision_note, created_at, decided_at]
      description: >
        A download request of a user the approval policy governs (an admin's
        own requests, and every request with authentication off, are never
        recorded).
      properties:
        id:
          type: string
        kind:
          $ref: "#/components/schemas/DownloadRequestKind"
        status:
          $ref: "#/components/schemas/DownloadRequestStatus"
        auto:
          type: boolean
          description: Approved by the policy, not by an admin.
        reason:
          $ref: "#/components/schemas/DownloadRequestReason"
        target:
          type: object
          required: [provider, id]
          description: What was asked for (empty for `liked_elsewhere`).
          properties:
            provider:
              type: string
            id:
              type: string
        title:
          type: string
        subtitle:
          type: string
          description: The artist of a track or album.
        cover_url:
          type: [string, "null"]
        needed_tracks:
          type: integer
          description: The tracks that needed a download when it was decided.
        queued_tracks:
          type: [integer, "null"]
          description: >
            The new downloads an approved request queued (null while it is
            pending, denied or cancelled, or still being queued); this, or
            `needed_tracks` while it is being queued, is what the user's quota
            counts.
        dispatched_to:
          type: [string, "null"]
          description: The external system an approved album was handed to, if any.
        add_to_favorites:
          type: boolean
          description: The tracks become the requester's favorites when they arrive (applied on approval).
        decision_note:
          type: [string, "null"]
          description: The admin's note on an approval, or the reason of a denial.
        created_at:
          type: string
          format: date-time
        decided_at:
          type: [string, "null"]
          format: date-time

    AdminDownloadRequest:
      description: A request as an admin sees it, with who asked and who decided.
      allOf:
        - $ref: "#/components/schemas/DownloadRequest"
        - type: object
          required: [requested_by, decided_by]
          properties:
            requested_by:
              type: object
              required: [id, username]
              properties:
                id:
                  type: string
                username:
                  type: [string, "null"]
            decided_by:
              type: [object, "null"]
              description: The admin who decided (the requester, for a cancellation).
              required: [id, username]
              properties:
                id:
                  type: string
                username:
                  type: [string, "null"]

    DownloadRequestsPage:
      type: object
      required: [items, total, page, limit, pages]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/DownloadRequest"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
        pages:
          type: integer

    AdminDownloadRequestsPage:
      type: object
      required: [items, total, page, limit, pages]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminDownloadRequest"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
        pages:
          type: integer

    DownloadRequestChange:
      type: object
      required: [request, changed]
      description: >
        The request after a decision. `changed` is false when it was already in
        the state asked for (the call did nothing).
      properties:
        request:
          $ref: "#/components/schemas/DownloadRequest"
        changed:
          type: boolean

    DownloadRequestDecisionBatch:
      type: object
      required: [results]
      properties:
        results:
          type: array
          description: One entry per distinct id, in the order sent.
          items:
            type: object
            required: [id, outcome, request]
            properties:
              id:
                type: string
              outcome:
                type: string
                enum: [decided, unchanged, conflict, not_found, failed]
                description: >
                  `decided`: this call changed it. `unchanged`: it was already
                  in that state. `conflict`: it was decided otherwise.
                  `not_found`. `failed`: queueing an approved request raised;
                  it stays pending.
              request:
                oneOf:
                  - $ref: "#/components/schemas/AdminDownloadRequest"
                  - type: "null"

    DownloadRequestApprove:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: string
        note:
          type: [string, "null"]
          maxLength: 500

    DownloadRequestDeny:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: string
        reason:
          type: [string, "null"]
          maxLength: 500

    DownloadPolicyRule:
      type: object
      required: [mode, threshold]
      properties:
        mode:
          $ref: "#/components/schemas/DownloadRequestMode"
        threshold:
          type: integer
          minimum: 1
          description: The most tracks approved at once; only read by `auto_up_to`.

    DownloadPolicyRules:
      type: object
      required: [track, album, playlist, artist, liked_elsewhere]
      properties:
        track:
          $ref: "#/components/schemas/DownloadPolicyRule"
        album:
          $ref: "#/components/schemas/DownloadPolicyRule"
        playlist:
          $ref: "#/components/schemas/DownloadPolicyRule"
        artist:
          $ref: "#/components/schemas/DownloadPolicyRule"
        liked_elsewhere:
          $ref: "#/components/schemas/DownloadPolicyRule"

    DownloadPolicy:
      type: object
      required: [rules, quota]
      description: >
        A download approval policy: the rule of each kind of request and the
        per-user quota. The general one is the settings of the
        `download_requests` group.
      properties:
        rules:
          $ref: "#/components/schemas/DownloadPolicyRules"
        quota:
          type: object
          required: [tracks, window_days]
          properties:
            tracks:
              type: integer
              minimum: 0
              description: >
                The tracks the approved requests of one user may queue in the
                window; a request that would pass it waits. 0 = no quota.
            window_days:
              type: integer
              minimum: 1
              description: A rolling window, counted back from now.

    DownloadPolicyPatch:
      type: object
      description: A partial general policy. Every field is optional, unknown ones are refused.
      additionalProperties: false
      properties:
        rules:
          type: object
          additionalProperties: false
          properties:
            track:
              $ref: "#/components/schemas/DownloadPolicyRulePatch"
            album:
              $ref: "#/components/schemas/DownloadPolicyRulePatch"
            playlist:
              $ref: "#/components/schemas/DownloadPolicyRulePatch"
            artist:
              $ref: "#/components/schemas/DownloadPolicyRulePatch"
            liked_elsewhere:
              $ref: "#/components/schemas/DownloadPolicyRulePatch"
        quota:
          type: object
          additionalProperties: false
          properties:
            tracks:
              type: integer
              minimum: 0
            window_days:
              type: integer
              minimum: 1

    DownloadPolicyRulePatch:
      type: object
      additionalProperties: false
      properties:
        mode:
          $ref: "#/components/schemas/DownloadRequestMode"
        threshold:
          type: integer
          minimum: 1

    UserDownloadPolicyOverride:
      type: object
      required: [rules, quota_tracks]
      description: >
        What an admin changed, for one user, in the approval policy. A field
        that is missing or null inherits the general policy.
      properties:
        rules:
          type: object
          description: Only the kinds the admin changed.
          additionalProperties: false
          properties:
            track:
              $ref: "#/components/schemas/UserDownloadPolicyRule"
            album:
              $ref: "#/components/schemas/UserDownloadPolicyRule"
            playlist:
              $ref: "#/components/schemas/UserDownloadPolicyRule"
            artist:
              $ref: "#/components/schemas/UserDownloadPolicyRule"
            liked_elsewhere:
              $ref: "#/components/schemas/UserDownloadPolicyRule"
        quota_tracks:
          type: [integer, "null"]
          minimum: 0
          description: The user's own quota; 0 means no quota for this user, null inherits.

    UserDownloadPolicyRule:
      type: object
      additionalProperties: false
      properties:
        mode:
          oneOf:
            - $ref: "#/components/schemas/DownloadRequestMode"
            - type: "null"
        threshold:
          type: [integer, "null"]
          minimum: 1

    UserDownloadPolicyBody:
      type: object
      description: The override to store (it replaces the previous one; an empty one clears it).
      additionalProperties: false
      properties:
        rules:
          type: [object, "null"]
          additionalProperties: false
          properties:
            track:
              $ref: "#/components/schemas/UserDownloadPolicyRule"
            album:
              $ref: "#/components/schemas/UserDownloadPolicyRule"
            playlist:
              $ref: "#/components/schemas/UserDownloadPolicyRule"
            artist:
              $ref: "#/components/schemas/UserDownloadPolicyRule"
            liked_elsewhere:
              $ref: "#/components/schemas/UserDownloadPolicyRule"
        quota_tracks:
          type: [integer, "null"]
          minimum: 0

    UserDownloadPolicyView:
      type: object
      required: [override, effective]
      properties:
        override:
          $ref: "#/components/schemas/UserDownloadPolicyOverride"
        effective:
          $ref: "#/components/schemas/DownloadPolicy"

    ViewerDownloadPolicy:
      type: object
      required: [applies, rules, quota]
      description: >
        What a download request of the viewer would meet right now, so the UI
        can label a download button honestly (the server stays the only judge
        when the request is made). `applies` is false for an admin and with
        authentication off (no individual users): `rules` and `quota` are then
        null.
      properties:
        applies:
          type: boolean
        rules:
          type: [object, "null"]
          required: [track, album, playlist, artist, liked_elsewhere]
          additionalProperties: false
          properties:
            track:
              $ref: "#/components/schemas/ViewerDownloadRule"
            album:
              $ref: "#/components/schemas/ViewerDownloadRule"
            playlist:
              $ref: "#/components/schemas/ViewerDownloadRule"
            artist:
              $ref: "#/components/schemas/ViewerDownloadRule"
            liked_elsewhere:
              $ref: "#/components/schemas/ViewerDownloadRule"
        quota:
          type: [object, "null"]
          required: [tracks, window_days, used, remaining]
          additionalProperties: false
          properties:
            tracks:
              type: integer
              description: The quota; 0 = none.
            window_days:
              type: integer
            used:
              type: integer
              description: The tracks the viewer's approved requests queued in the window.
            remaining:
              type: [integer, "null"]
              description: Room left in the quota (null when there is no quota).

    ViewerDownloadRule:
      type: object
      required: [mode, threshold, auto_up_to]
      properties:
        mode:
          $ref: "#/components/schemas/DownloadRequestMode"
        threshold:
          type: integer
        auto_up_to:
          type: [integer, "null"]
          description: >
            The most tracks that need a download a request of this kind can have
            and still be approved at once right now, the quota left included:
            null = no limit, 0 = it always waits.

    DownloadRequestEvent:
      type: object
      required: [type, event, request]
      description: >
        A download request on /progress. To its requester (with `user_id`),
        admins excluded: it was approved or denied. To the admins (no
        `user_id`, with `pending`, the number of requests now waiting): a
        request is waiting, or was decided or cancelled.
      properties:
        type:
          type: string
          enum: [download_request]
        event:
          type: string
          enum: [pending, approved, denied, cancelled]
        user_id:
          type: string
        pending:
          type: integer
        request:
          oneOf:
            - $ref: "#/components/schemas/DownloadRequest"
            - $ref: "#/components/schemas/AdminDownloadRequest"

    # ── Playlists ───────────────────────────────────────────────────
    PlaylistBody:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 2000

    PlaylistPatch:
      type: object
      description: At least one field.
      properties:
        name:
          type: [string, "null"]
          minLength: 1
          maxLength: 200
        description:
          type: [string, "null"]
          maxLength: 2000
        auto_download:
          type: [boolean, "null"]
          description: Followed playlists only; download the tracks the source gains.

    PlaylistTrackRef:
      type: object
      description: Either `track_id`, or `provider` together with `provider_id`.
      properties:
        track_id:
          type: [string, "null"]
          description: The `library_id` of a listed track.
        provider:
          type: [string, "null"]
        provider_id:
          type: [string, "null"]

    PlaylistSummary:
      type: object
      required:
        - id
        - name
        - description
        - kind
        - source_provider
        - source_id
        - cover_url
        - track_count
        - auto_download
        - tracks_unavailable
        - refresh_error_code
        - checked_at
        - created_at
        - updated_at
        - synced_to
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        kind:
          type: string
          enum: [own, followed]
          description: >
            `own` is edited by its owner; `followed` mirrors a playlist of a
            metadata provider (read-only).
        source_provider:
          type: [string, "null"]
          description: Followed playlists only.
        source_id:
          type: [string, "null"]
        cover_url:
          type: [string, "null"]
          description: The source's cover, else the first track's.
        track_count:
          type: integer
        auto_download:
          type: boolean
        tracks_unavailable:
          anyOf:
            - $ref: "#/components/schemas/TracksUnavailable"
            - type: "null"
          description: The provider would not give the tracks of this followed playlist.
        refresh_error_code:
          type: [string, "null"]
          description: Why the last look at the source failed; null when it did not.
        checked_at:
          type: [string, "null"]
          format: date-time
          description: When the source was last looked at (followed playlists).
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        synced_to:
          type: array
          description: The sync providers that hold a copy on the owner's own account.
          items:
            type: object
            required: [sync_provider, synced_at]
            properties:
              sync_provider:
                type: string
              synced_at:
                type: string
                format: date-time

    PlaylistTrack:
      description: A track of a playlist.
      allOf:
        - $ref: "#/components/schemas/Track"
        - type: object
          required: [added_at]
          properties:
            added_at:
              type: string
              format: date-time

    PlaylistDetail:
      description: A playlist with its tracks, in order.
      allOf:
        - $ref: "#/components/schemas/PlaylistSummary"
        - type: object
          required: [tracks]
          properties:
            tracks:
              type: array
              items:
                $ref: "#/components/schemas/PlaylistTrack"

    PlaylistDownload:
      type: object
      required: [status]
      description: What a request to download the tracks of a playlist came to.
      properties:
        status:
          type: string
          enum: [queued, pending_approval, none, error]
        queued:
          type: integer
        skipped:
          type: integer
        request_id:
          type: string
          description: With `pending_approval`; the request is in GET /download-requests.
        kind:
          $ref: "#/components/schemas/DownloadRequestKind"
        needed_tracks:
          type: integer
        reason:
          type: string
          enum: [kind_requires_approval, over_threshold, over_quota]

    FollowResult:
      type: object
      required: [playlist, created, download]
      properties:
        playlist:
          $ref: "#/components/schemas/PlaylistSummary"
        created:
          type: boolean
        download:
          $ref: "#/components/schemas/PlaylistDownload"

    PlaylistErrorResponse:
      type: object
      required: [detail]
      properties:
        detail:
          type: object
          required: [error_code, error_message]
          properties:
            error_code:
              type: string
              enum:
                - playlist_not_found
                - playlist_read_only
                - playlist_full
                - playlist_invalid_order
                - playlist_not_followed
                - track_not_found
            error_message:
              type: string
            max_tracks:
              type: integer
              description: Only on `playlist_full`; the cap.
            track_count:
              type: integer
              description: Only on `playlist_full`; the tracks the playlist holds.
            adding:
              type: integer
              description: Only on `playlist_full`; the tracks the request would add.
            track_id:
              type: string
              description: Only on `track_not_found`.
            provider:
              type: string
              description: Only on `track_not_found`, for a track a provider names.
            provider_id:
              type: string

    CodedErrorResponse:
      type: object
      required: [detail]
      properties:
        detail:
          type: object
          required: [error_code, error_message]
          properties:
            error_code:
              type: string
              example: request_already_decided
            error_message:
              type: string

    DiscographyErrorResponse:
      type: object
      required: [detail]
      properties:
        detail:
          type: object
          required: [error_code, error_message]
          properties:
            error_code:
              type: string
              enum: [discography_not_supported, discography_empty, discography_too_large]
            error_message:
              type: string
            releases:
              type: integer
              description: Only on `discography_too_large`; the releases of the chosen types.
            max_releases:
              type: integer
              description: Only on `discography_too_large`; the most one request reads.

    # ── External utility intake ─────────────────────────────────────
    ExternalUtilityOAuthClientBody:
      type: object
      required: [client_id, client_secret]
      properties:
        client_id:
          type: string
        client_secret:
          type: string

    ExternalUtilityAccountBody:
      type: object
      description: >
        The account the utility captured, as the utility defines it: any JSON object, kept
        as received and handed to the provider.
      additionalProperties: true

    # ── Generic responses ───────────────────────────────────────────
    OkResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          const: true

    ErrorResponse:
      type: object
      required: [detail]
      properties:
        detail:
          type: string

    SettingsErrorResponse:
      description: >
        A refused settings write. `detail` is a plain text (unknown key, invalid
        value, unavailable setting...), or `{error_code, error_message}` when
        the refusal has a stable code the UI translates. Code
        `auth_secret_insecure`: authentication cannot be turned on
        (`auth_enabled: true`) while the server's `AUTH_SECRET` is missing,
        shorter than 32 characters or a placeholder; the batch is refused whole
        and nothing is written. The message never contains the secret. Turning
        authentication off is always allowed.
      type: object
      required: [detail]
      properties:
        detail:
          oneOf:
            - type: string
            - type: object
              required: [error_code, error_message]
              additionalProperties: false
              properties:
                error_code:
                  type: string
                  example: auth_secret_insecure
                error_message:
                  type: string

    ProviderErrorResponse:
      type: object
      required: [detail]
      properties:
        detail:
          type: object
          required: [error_code, error_message]
          properties:
            error_code:
              type: [string, "null"]
              description: >
                `<subject>_<kind>`, e.g. metadata_provider_upstream_error.
                Kinds: unreachable, timeout, rate_limited, not_configured,
                auth_failed, upstream_error, failed. `database_busy` when the
                database is locked.
              example: metadata_provider_upstream_error
            error_message:
              type: [string, "null"]
            provider:
              type: string
              description: The provider that failed (absent for database_busy).
            error_detail:
              type: string
              description: Raw error text, admins only.

    ProviderError:
      type: object
      description: A provider that failed during an aggregated read.
      required: [provider, error_code, error_message]
      properties:
        provider:
          type: string
        error_code:
          type: string
          example: metadata_provider_upstream_error
        error_message:
          type: string

    ProviderErrors:
      type: array
      description: >
        Providers that failed while building this response. The response holds
        what the others returned; a non-empty list means the results may be
        incomplete. A provider that is simply not configured is not listed.
      items:
        $ref: "#/components/schemas/ProviderError"

  parameters:
    Provider:
      name: provider
      in: path
      required: true
      schema:
        type: string
    ItemId:
      name: id
      in: path
      required: true
      schema:
        type: string
    IntakeName:
      name: intake_name
      in: path
      required: true
      description: The `intake_name` a provider declares in its `ExternalUtilityConfig`.
      schema:
        type: string
        pattern: "^[a-z][a-z0-9-]{0,63}$"
    DiscoverLimit:
      name: limit
      in: query
      schema:
        type: integer
        default: 20

  responses:
    SourceRefused:
      description: >-
        A refusal with a stable code in `detail.error_code` (the operation lists them) and a
        plain text in `detail.error_message`. No response ever contains a source's token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SourceErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing or invalid JWT token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ProviderFailed:
      description: >
        The provider answered with an error or refused the credentials. Not
        retryable as is.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProviderErrorResponse"
    TooManyRequests:
      description: >-
        Too many sign-in attempts from this address in the window (`detail.error_code`
        `provider_login_rate_limited`); `Retry-After` says when to try again.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            type: object
    ServiceUnavailable:
      description: >
        Retryable: the provider is unreachable, too slow, rate-limited or not
        configured, or the database is busy (error_code database_busy).
      headers:
        Retry-After:
          description: >
            Seconds to wait before retrying; for a rate-limited provider that
            says how long its limit lasts, that time (at most one hour).
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProviderErrorResponse"

security:
  - BearerAuth: []

paths:
  # ════════════════════════════════════════════════════════════════════
  # User Authentication
  # ════════════════════════════════════════════════════════════════════

  /auth/account/status:
    get:
      operationId: getAuthStatus
      tags: [user-auth]
      summary: Auth status, and what the current viewer can do
      description: >
        mode and capabilities are computed on the server for the viewer (a
        missing, expired or deactivated user's token counts as guest). The UI
        shows or hides actions from them; routes stay protected by their own
        dependencies.
      security:
        - {}
        - BearerAuth: []
      responses:
        "200":
          description: Auth configuration and viewer capabilities
          content:
            application/json:
              schema:
                type: object
                required: [auth_enabled, registration_open, mode, capabilities, download_policy]
                properties:
                  auth_enabled:
                    type: boolean
                  registration_open:
                    type: boolean
                  mode:
                    type: string
                    enum: [open, guest, user, admin]
                    description: open = auth disabled.
                  capabilities:
                    $ref: "#/components/schemas/ViewerCapabilities"
                  download_policy:
                    description: >
                      What a download request of the viewer would meet right
                      now (null for a guest, who cannot download).
                    oneOf:
                      - $ref: "#/components/schemas/ViewerDownloadPolicy"
                      - type: "null"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /auth/account/register:
    post:
      operationId: register
      tags: [user-auth]
      summary: Register a new user account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterBody"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPublic"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Username or email already taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /auth/account/login:
    post:
      operationId: login
      tags: [user-auth]
      summary: Authenticate and obtain JWT tokens
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
      responses:
        "200":
          description: JWT token pair
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /auth/account/login-providers:
    get:
      operationId: listLoginProviders
      tags: [user-auth]
      summary: The providers a user can sign in through
      description: >-
        Providers that declare the `login` capability (`BaseProvider.supports_login`) and have accounts
        of a user's own; an OAuth2 one is listed once an admin set its app up. Public, like the login
        page it feeds. Empty with authentication off. A user signs in through a provider only if they
        linked it from an open session (Settings > Linked accounts) or the admin policy
        `provider_login_new_accounts` lets a new account be created: an email or a name never links
        two accounts.
      security: []
      responses:
        "200":
          description: The providers, from what each declares
          content:
            application/json:
              schema:
                type: object
                required: [providers]
                properties:
                  providers:
                    type: array
                    items:
                      $ref: "#/components/schemas/LoginProvider"

  /auth/account/login/{provider}/start:
    get:
      operationId: startProviderLogin
      tags: [user-auth]
      summary: Send the browser to a provider's authorization to sign in (OAuth2)
      description: >-
        Redirects to the provider. The signed `state` names the provider and carries the hash of a
        nonce the response also sets in the HttpOnly cookie `musizerr_login_nonce`; the callback
        (`/auth/{provider}/callback`) needs both, so a browser cannot finish an authorization another
        one started. The start and the callback must be served from the same host. Rate limited per
        client address.
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the provider's authorization page
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/account/login/{provider}/credentials:
    post:
      operationId: loginWithProviderCredentials
      tags: [user-auth]
      summary: Sign in with a provider's login account
      description: >-
        The body is exactly the fields the provider declares in `credential_fields`; the provider
        checks them (`identify_account`) and says who the account is. The user it is linked to signs
        in. For an account nobody linked, `provider_login_new_accounts` decides: `disabled` refuses
        (403 `provider_login_disabled`), `pending` creates an account that waits for an admin (403
        `account_pending`), `active` creates it and signs in. The created account is always a `user`.
        Rate limited per client address.
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialsBody"
      responses:
        "200":
          description: JWT token pair
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: The provider refused the credentials (`detail.error_code` `provider_login_refused`)
        "403":
          description: >-
            Not allowed: `detail.error_code` is `provider_login_disabled`, `account_pending` or
            `account_deactivated`
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: The body is not exactly the fields the provider declares
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          $ref: "#/components/responses/ProviderFailed"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /auth/account/login/exchange:
    post:
      operationId: exchangeProviderLoginCode
      tags: [user-auth]
      summary: Exchange the one-time code of a sign-in for a session
      description: >-
        The callback of an OAuth2 sign-in sends the browser to `/login/provider?code=...` (or
        `?error=<error_code>`): a session never travels in a URL. The code lives 60 seconds, works
        once (a second use, an unknown or an expired code is a 401 `provider_login_invalid_code`) and
        yields the same session a password login does. Rate limited per client address.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginCodeBody"
      responses:
        "200":
          description: JWT token pair
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Invalid, used or expired code (`provider_login_invalid_code`)
        "403":
          description: The account was deactivated or is waiting for an admin (`account_deactivated`, `account_pending`)
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/account/refresh:
    post:
      operationId: refreshToken
      tags: [user-auth]
      summary: Refresh an expired access token
      description: >
        Rotates the refresh token: the answer carries its successor and the
        token sent stops working. Every tab of a browser shares the token, so
        presenting a token rotated less than a minute ago answers the SAME new
        pair (with a fresh access token) instead of a 401. Presenting it later
        is treated as reuse of a stolen token: every token of that sign-in is
        revoked and the answer is 401.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshBody"
      responses:
        "200":
          description: New JWT token pair (the refresh token sent is rotated)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /auth/account/logout:
    post:
      operationId: logout
      tags: [user-auth]
      summary: Revoke a refresh token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshBody"
      responses:
        "204":
          description: Refresh token revoked
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /auth/account/me:
    get:
      operationId: getMe
      tags: [user-auth]
      summary: Get current user profile
      responses:
        "200":
          description: Current user info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPublic"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  # ════════════════════════════════════════════════════════════════════
  # Admin
  # ════════════════════════════════════════════════════════════════════

  /admin/users:
    get:
      operationId: listUsers
      tags: [admin]
      summary: List all users (admin only)
      responses:
        "200":
          description: User list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserPublic"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /admin/users/{user_id}:
    patch:
      operationId: updateUser
      tags: [admin]
      summary: Update a user's role, status, or password (admin only)
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserPatch"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPublic"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    delete:
      operationId: deleteUser
      tags: [admin]
      summary: Delete a user (admin only)
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: User deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  # ════════════════════════════════════════════════════════════════════
  # Provider Authentication
  # ════════════════════════════════════════════════════════════════════

  /auth/status:
    get:
      operationId: getGlobalAuthStatus
      tags: [auth]
      summary: Global auth status (probed by external tools)
      security: []
      responses:
        "200":
          description: Global auth status
          content:
            application/json:
              schema:
                type: object
                required: [auth_enabled, authenticated, registration_open]
                properties:
                  auth_enabled:
                    type: boolean
                  authenticated:
                    type: boolean
                  registration_open:
                    type: boolean
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /auth/{provider}/start:
    get:
      operationId: authStart
      tags: [auth]
      summary: Start OAuth2 flow (redirects to provider)
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
        - name: target
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AccountTarget"
          description: >-
            The account the call is about. Omitted: the caller's own when the provider has personal
            accounts, else the shared one. `shared` needs the admin role; a model without that account is a 400.
      responses:
        "302":
          description: Redirect to provider's authorization URL
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /auth/{provider}/callback:
    get:
      operationId: authCallback
      tags: [auth]
      summary: OAuth2 callback (redirects to frontend)
      description: >-
        The signed `state` says which flow this is. Linking: it carries who started the flow and which
        account (own or shared) the token becomes; the rule that let them start it is checked again
        here, and for a provider that can sign users in the provider is asked who the account is (an
        account another user already linked is a 409). Sign-in (started by
        `/auth/account/login/{provider}/start`): the state and the nonce cookie must belong together
        and the browser is redirected to `/login/provider?code=<one-time code>` (exchange it at
        `/auth/account/login/exchange`) or `/login/provider?error=<error_code>`; it never answers JSON.
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
        - name: code
          in: query
          required: false
          schema:
            type: string
          description: Missing when the user refused at the provider (a linking answers 400, a sign-in lands on the error page).
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        "302":
          description: Redirect to frontend with auth result
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Linking only. The provider's account is already linked to another user.
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /auth/{provider}/status:
    get:
      operationId: getProviderAuthStatus
      tags: [auth]
      summary: Check if a provider is authenticated
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Provider auth status
          content:
            application/json:
              schema:
                type: object
                required: [provider, authenticated]
                properties:
                  provider:
                    type: string
                  authenticated:
                    type: boolean
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /auth/{provider}/apikey:
    post:
      operationId: saveApiKey
      tags: [auth]
      summary: Save an API key for a provider
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiKeyBody"
      responses:
        "200":
          description: API key saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /auth/{provider}/client:
    post:
      operationId: saveOAuthClient
      tags: [auth]
      summary: Save OAuth2 client credentials for a provider
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OAuthClientBody"
      responses:
        "200":
          description: OAuth client saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    delete:
      operationId: deleteOAuthClient
      tags: [auth]
      summary: Delete OAuth2 client credentials and tokens
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OAuth client deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /auth/{provider}/credentials:
    post:
      operationId: saveCredentials
      tags: [auth]
      summary: Connect a login account (own or shared) to a provider
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
        - name: target
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AccountTarget"
          description: >-
            The account the call is about. Omitted: the caller's own when the provider has personal
            accounts, else the shared one. `shared` needs the admin role; a model without that account is a 400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialsBody"
      responses:
        "200":
          description: Credentials saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >-
            The provider's account is already linked to another user (only for a provider that can sign
            users in: the host asks it who the account is, and stores the id).
        "422":
          description: The fields are not the ones the provider declares, or the provider did not recognise the account.
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /auth/{provider}/test:
    post:
      operationId: testProviderConnection
      tags: [auth]
      summary: Test connectivity to a provider
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
        - name: scope
          in: query
          required: false
          schema:
            type: string
            enum: [app, account]
            default: account
          description: >-
            `app`: the instance's OAuth2 app client (admins only). `account`: an account of the provider.
        - name: target
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AccountTarget"
          description: >-
            With `scope=account`: test the caller's own account or the shared one (admins only).
            Omitted: the account the caller's own calls would use.
      responses:
        "200":
          description: Connection test results
          content:
            application/json:
              schema:
                type: object
                properties:
                  app:
                    type: [object, "null"]
                    properties:
                      ok:
                        type: boolean
                      detail:
                        type: string
                  account:
                    type: [object, "null"]
                    properties:
                      ok:
                        type: boolean
                      detail:
                        type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /auth/{provider}:
    delete:
      operationId: revokeAuth
      tags: [auth]
      summary: Disconnect an account of a provider (the caller's own, or the shared one as an admin)
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
        - name: target
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AccountTarget"
          description: >-
            The account the call is about. Omitted: the caller's own when the provider has personal
            accounts, else the shared one. `shared` needs the admin role; a model without that account is a 400.
      responses:
        "200":
          description: Auth revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  # ════════════════════════════════════════════════════════════════════
  # Search
  # ════════════════════════════════════════════════════════════════════

  /search:
    get:
      operationId: search
      tags: [search]
      summary: Search across metadata providers
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [track, album, artist, playlist]
            default: track
        - name: providers
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                type: object
                required: [type, query, items, total, page, limit, pages, provider_errors]
                properties:
                  type:
                    type: string
                    enum: [track, album, artist, playlist]
                  query:
                    type: string
                  items:
                    type: array
                    description: >
                      Array of Track, Album, Artist, or Playlist objects
                      depending on the `type` parameter.
                    items:
                      oneOf:
                        - $ref: "#/components/schemas/Track"
                        - $ref: "#/components/schemas/Album"
                        - $ref: "#/components/schemas/Artist"
                        - $ref: "#/components/schemas/Playlist"
                  provider_errors:
                    $ref: "#/components/schemas/ProviderErrors"
                  total:
                    type: integer
                    description: "Results returned (search is not paginated: page is always 1 and limit equals total)."
                  page:
                    type: integer
                  limit:
                    type: integer
                  pages:
                    type: integer
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  # ════════════════════════════════════════════════════════════════════
  # Track
  # ════════════════════════════════════════════════════════════════════
        "401":
          $ref: "#/components/responses/Unauthorized"

  /track/{provider}/{id}:
    get:
      operationId: getTrack
      tags: [track]
      summary: Get track metadata (cross-enriched)
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Track with cross-provider identifiers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Track"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/ProviderFailed"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /track/{provider}/{id}/lyrics:
    get:
      operationId: getTrackLyrics
      tags: [track]
      summary: Get lyrics for a track
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Lyrics (plain and/or synced)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lyrics"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/ProviderFailed"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /download/track:
    post:
      operationId: downloadTrack
      tags: [track]
      summary: Enqueue a track for download
      description: >
        Requires a signed-in user when auth is enabled: a guest gets 401 and
        nothing is created or queued. With auth disabled the download has no
        requester. The track is resolved on its canonical library record
        whatever provider row it comes from: a track already in the library
        is not downloaded again (`already_in_library`) unless an admin sends
        `force`; a track with an open request joins it (`attached`). The
        `track` carries the state this request produced, like every track
        list (`download_status`, `in_library`, `favorite`, `favorite_pending`,
        `playback`): a user's download answers `favorite_pending: true`.
        Download approval policy: for a user (not an admin, and not with auth
        disabled) the request first goes through the policy
        (see GET /admin/download-policy). Approved at once, it behaves as
        described here; if it waits for an admin it answers 202
        `pending_approval` and nothing is queued, delegated or marked as a
        favorite until an admin approves it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DownloadBody"
      responses:
        "200":
          description: The request's outcome
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DownloadRequestResult"
                  - type: object
                    required: [track]
                    properties:
                      track:
                        $ref: "#/components/schemas/Track"
        "202":
          description: >
            The request waits for an admin (approval policy): nothing was
            queued, delegated or marked as a favorite. It is in GET /download-requests.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadPendingApproval"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "502":
          $ref: "#/components/responses/ProviderFailed"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  # ════════════════════════════════════════════════════════════════════
  # Album
  # ════════════════════════════════════════════════════════════════════

  /album/{provider}/{id}:
    get:
      operationId: getAlbum
      tags: [album]
      summary: Get album metadata with tracks (cross-enriched)
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Album with tracks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Album"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/ProviderFailed"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /album/{provider}/{id}/editions:
    get:
      operationId: getAlbumEditions
      tags: [album]
      summary: The editions of an album's release on the same provider
      description: >
        Standard, deluxe, remaster and other editions of the same release,
        grouped like the artist discography (the same matcher), from the
        album's own provider only: no cross-provider enrichment, so it is cheap
        enough to load with the album page. Ordered by year, then title.
        Includes the album itself; empty when the provider does not know the
        album's artist.
      security: []
      parameters:
        - $ref: "#/components/parameters/Provider"
        - $ref: "#/components/parameters/ItemId"
      responses:
        "200":
          description: Editions
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/AlbumEdition"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/ProviderFailed"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /download/album:
    post:
      operationId: downloadAlbum
      tags: [album]
      summary: Download all tracks of an album
      description: >
        Requires a signed-in user when auth is enabled: a guest gets 401 and
        nothing is created or queued. With auth disabled the download has no
        requester.
        May dispatch to an album-level download provider (e.g. Lidarr) if
        available, otherwise enqueues each track individually. The tracks of
        `album` carry the state the request produced (`download_status`,
        `in_library`, `favorite`, `favorite_pending`, `playback`).
        Download approval policy: for a user (not an admin, and not with auth
        disabled) the request first goes through the policy
        (see GET /admin/download-policy). Approved at once, it behaves as
        described here; if it waits for an admin it answers 202
        `pending_approval` and nothing is queued, delegated or marked as a
        favorite until an admin approves it.
        The delegation to an album-level provider is governed too: while the
        request waits nothing is handed over, and on approval it is dispatched
        as described above.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DownloadBody"
      responses:
        "200":
          description: Download enqueued or dispatched
          content:
            application/json:
              schema:
                type: object
                required: [download_ids, album, total_tracks]
                properties:
                  download_ids:
                    type: array
                    items:
                      type: string
                  album:
                    $ref: "#/components/schemas/Album"
                  total_tracks:
                    type: integer
                    description: Tracks queued (skipped ones excluded)
                  skipped:
                    type: integer
                    description: Tracks left out because already in the library (only_missing)
                  dispatched_to:
                    type: string
                    description: Present when dispatched to an album-level provider
                  details:
                    type: array
                    description: >
                      What the album-level provider reported about the hand-over
                      (a list; the shape of each entry is the provider's, the
                      host does not interpret it).
                    items: {}
        "202":
          description: >
            The request waits for an admin (approval policy): nothing was
            queued, delegated or marked as a favorite. It is in GET /download-requests.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadPendingApproval"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          $ref: "#/components/responses/ProviderFailed"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  # ════════════════════════════════════════════════════════════════════
  # Artist
  # ════════════════════════════════════════════════════════════════════

  /artist/{provider}/{id}:
    get:
      operationId: getArtist
      tags: [artist]
      summary: Get artist metadata (cross-enriched)
      description: >
        Carries `discography_downloadable`: whether POST /download/artist can
        gather this artist's discography from its provider.
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Artist info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Artist"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/ProviderFailed"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /artist/{provider}/{id}/albums:
    get:
      operationId: getArtistAlbums
      tags: [artist]
      summary: An artist's discography, one entry per release
      description: >
        Editions of the same release (deluxe, remaster, regional, the same
        album from another provider) are one entry with an editions list; the
        representative follows metadata_provider_priority. The same release
        dated differently by two providers (typically a digital reissue carrying
        its upload date) is one entry too, when each provider lists only one
        release with that title, artist and type and the known track counts
        agree. An entry's year is its oldest edition's; each edition keeps its
        own. Order: by album_type (album, single, ep, compilation, live,
        appears_on, then unknown), then year descending (no year last), then
        title. Each entry carries its library coverage, and the response an
        artist-level summary. page and limit count releases, not editions.
        The provider is read up to 100 entries (editions included), paging
        inside; no search setting limits it. When it reaches that bound the
        list may be longer: `may_be_longer` says so.
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: Releases per page; all when omitted.
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: Paginated releases
          content:
            application/json:
              schema:
                type: object
                required: [items, total, page, limit, pages, library, may_be_longer]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Album"
                  total:
                    type: integer
                  page:
                    type: integer
                  limit:
                    type: integer
                  pages:
                    type: integer
                  library:
                    $ref: "#/components/schemas/LibraryCoverage"
                  may_be_longer:
                    type: boolean
                    description: The provider's listing reached the bound read, so the artist may have more releases.
                  provider_errors:
                    $ref: "#/components/schemas/ProviderErrors"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/ProviderFailed"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /download/artist:
    post:
      operationId: downloadArtist
      tags: [artist]
      summary: Download an artist's whole discography
      description: >
        Requires a signed-in user when auth is enabled: a guest gets 401 and
        nothing is created or queued. With auth disabled the download has no
        requester.
        Only for a provider that declares the `discography` capability
        (`discography_downloadable` of GET /artist/{provider}/{id}): any other
        is a 422 `discography_not_supported`. The artist's releases are
        listed on that provider and grouped like GET /artist/{provider}/{id}/albums
        (the editions of one release are one); those of `release_types`
        (default: albums, singles and EPs, never compilations, live or
        "appears on") are read one at a time through the representative edition
        and their tracks collected, albums first, the same song once (the
        single's copy of a song on the album is dropped). The provider's whole
        listing is read first (up to 200 entries, editions included, paging
        inside; no search setting limits it). At most 60 releases of the chosen
        types are read per request: more is a 422 `discography_too_large`,
        never a partial discography, and so is a listing that reaches the 200
        (the releases cannot then be counted). A release that cannot be read does not stop the
        others: it is counted in `releases_failed` and its provider's failure
        is in `provider_errors`; a provider that says it is rate limiting is
        not asked again in the request. Nothing readable at all is a 422
        `discography_empty`, or the provider's own failure (502/503) when it
        failed on every release.
        Download approval policy: for a user (not an admin, and not with auth
        disabled) the request first goes through the policy
        (see GET /admin/download-policy), counting the gathered tracks that
        need a download. Approved at once, it behaves as described here; if it
        waits for an admin it answers 202 `pending_approval` and nothing is
        queued, delegated or marked as a favorite until an admin approves it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DownloadBody"
      responses:
        "200":
          description: Download enqueued
          content:
            application/json:
              schema:
                type: object
                required: [download_ids, artist, total_tracks, skipped, releases, releases_failed, provider_errors]
                properties:
                  download_ids:
                    type: array
                    items:
                      type: string
                  artist:
                    $ref: "#/components/schemas/Artist"
                  total_tracks:
                    type: integer
                  skipped:
                    type: integer
                    description: Tracks left out, already in the library.
                  releases:
                    type: integer
                    description: Releases whose tracks were read.
                  releases_failed:
                    type: integer
                    description: Releases that could not be read; their tracks are missing from the request.
                  provider_errors:
                    $ref: "#/components/schemas/ProviderErrors"
        "202":
          description: >
            The request waits for an admin (approval policy): nothing was
            queued, delegated or marked as a favorite. It is in GET /download-requests.
            It holds the tracks gathered; `releases_failed` and
            `provider_errors` say what is missing.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DownloadPendingApproval"
                  - type: object
                    required: [releases, releases_failed, provider_errors]
                    properties:
                      releases:
                        type: integer
                      releases_failed:
                        type: integer
                      provider_errors:
                        $ref: "#/components/schemas/ProviderErrors"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: >
            `detail.error_code` says why: `discography_not_supported` (the
            provider does not declare the capability), `discography_empty` (no
            release of the chosen types, or no track in them),
            `discography_too_large` (more than `max_releases` releases of the
            chosen types, `releases` of them, or a listing too long to count
            them; ask for fewer release types). Or
            the request body is not valid (an unknown release type).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/DiscographyErrorResponse"
                  - $ref: "#/components/schemas/ErrorResponse"
        "502":
          $ref: "#/components/responses/ProviderFailed"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  # ════════════════════════════════════════════════════════════════════
  # Playlist
  # ════════════════════════════════════════════════════════════════════

  /playlist/{provider}/{id}:
