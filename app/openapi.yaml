        "502":
          $ref: "#/components/responses/ProviderFailed"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /download/playlist:
    post:
      operationId: downloadPlaylist
      tags: [playlist]
      summary: Download all tracks in a playlist
      description: >
        Requires a signed-in user when auth is enabled: a guest gets 401 and
