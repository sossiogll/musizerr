[alembic]
# Path is relative to the directory `alembic` is invoked from.
# Always invoke from the `app/` dir (CWD inside the container).
script_location = migrations

# Prepend the working dir to sys.path so env.py can `import db.models`.
prepend_sys_path = .

# The DB URL is resolved at runtime in migrations/env.py (db.engine.database_url:
# DATABASE_URL, else the SQLite file of MUSIZEER_DATA_DIR). Keep this blank so a stale
# value never wins.
sqlalchemy.url =


[post_write_hooks]


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
