[pytest]
# I moduli dell'app importano con root /app (es. "from core.x import ...").
# pythonpath = . rende gli stessi import validi anche sotto pytest.
pythonpath = .
testpaths = tests
addopts = -q --strict-markers
filterwarnings =
    ignore::DeprecationWarning
markers =
    sqlite_only(reason): about SQLite itself (its pragmas, its lock); skipped on PostgreSQL
    postgresql_only(reason): about PostgreSQL itself (concurrent writers, its error codes); skipped on SQLite
