# The project name is pinned, so the containers, the network and the volumes are called musizeer-*, musizeer_default
# and musizeer_<volume> whatever the folder is called.
name: musizeer

# Every variable of this file is documented in docs/deployment.md (the reference table is generated from the
# registry, app/core/environment.py) and listed in .env.example. A variable is passed to a container with an EMPTY
# default when it is optional: an empty value means "unset", so the default of the registry applies and is written
# in one place only. The old names (AUTH_SECRET, CREDENTIALS_KEY, ...) are not read any more: a process that finds
# one set says which name replaces it, and the required ones below say it here.

# Il database di tutti i servizi: PostgreSQL (il servizio `postgres` qui sotto).
# POSTGRES_PASSWORD viene da .env (non versionato, vedi .env.example): una
# password sicura in un URL (lettere e cifre). Per restare su SQLite (file in
# MUSIZEER_DATA_DIR) si tolgono il servizio `postgres` e queste dipendenze: vedi
# docs/postgresql.md. The MUSIZEER_DB_* variables tune the connections (docs/postgresql.md).
x-database: &database
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-musizeer}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-musizeer}
  MUSIZEER_DB_BUSY_TIMEOUT_MS: ${MUSIZEER_DB_BUSY_TIMEOUT_MS:-}
  MUSIZEER_DB_STATEMENT_TIMEOUT_MS: ${MUSIZEER_DB_STATEMENT_TIMEOUT_MS:-}
  MUSIZEER_DB_POOL_SIZE: ${MUSIZEER_DB_POOL_SIZE:-}
  MUSIZEER_DB_MAX_OVERFLOW: ${MUSIZEER_DB_MAX_OVERFLOW:-}

# The key that encrypts the stored credentials (docs/credentials.md). MUSIZEER_CREDENTIALS_KEY comes from
# .env (not versioned, see .env.example) and every service that reads the database needs it: the
# init container (its migration encrypts the existing credentials), the API, the workers and beat.
# MUSIZEER_CREDENTIALS_KEY_PREVIOUS holds the keys it replaced, while a rotation is in progress. The provider
# gateway never gets either: a provider receives the credential a call needs, never the key.
x-credentials: &credentials
  MUSIZEER_CREDENTIALS_KEY: ${MUSIZEER_CREDENTIALS_KEY:?set MUSIZEER_CREDENTIALS_KEY in .env (it was CREDENTIALS_KEY; docs/credentials.md)}
  MUSIZEER_CREDENTIALS_KEY_PREVIOUS: ${MUSIZEER_CREDENTIALS_KEY_PREVIOUS:-}

# Where Musizeer is reached from outside (docs/deployment.md, "The public URL"): the address users type in
# their browser, with no trailing slash. OAuth2 providers send the browser back to it after the
# user signed in at the service ("<MUSIZEER_PUBLIC_URL>/api/auth/<provider>/callback"), and the application ends
# the flow on it. MUSIZEER_APP_BASE_URL (the callback's base, including /api) and MUSIZEER_FRONTEND_URL (where the
# flow ends) are derived from it by the application; set them only when the two differ (a proxy that strips /api,
# say). The default of MUSIZEER_PUBLIC_URL is the stack on this machine, on MUSIZEER_PORT 80.
x-public-urls: &public-urls
  MUSIZEER_PUBLIC_URL: ${MUSIZEER_PUBLIC_URL:-}
  MUSIZEER_APP_BASE_URL: ${MUSIZEER_APP_BASE_URL:-}
  MUSIZEER_FRONTEND_URL: ${MUSIZEER_FRONTEND_URL:-}
  MUSIZEER_ALLOWED_ORIGINS: ${MUSIZEER_ALLOWED_ORIGINS:-}

# What the API and the workers share and that is not secret: the prefix the browser reaches the API with (it is
# applied to the cover and stream URLs) and the repository whose releases are the updates (a fork names its own).
x-application: &application
  MUSIZEER_PUBLIC_API_PREFIX: ${MUSIZEER_PUBLIC_API_PREFIX:-}
  MUSIZEER_UPDATE_REPOSITORY: ${MUSIZEER_UPDATE_REPOSITORY:-}

# What a service that talks to the database, Redis and the providers waits for before it starts: the
# migrations done (init), the database and Redis answering, the gateway up. The gateway's health is its
# control socket answering; whether it can build a sandbox is another matter (`docker compose exec
# provider-gateway python -m musizeer_gateway.ctl health`), and the application works without providers.
x-backend-depends-on: &backend-depends-on
  init:
    condition: service_completed_successfully
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  provider-gateway:
    condition: service_healthy

# The images of Musizeer, published on GHCR for linux/amd64 and linux/arm64: every merge into master
# updates :latest, every release publishes :X.Y.Z. MUSIZEER_VERSION (in .env) pins a release and
# `docker compose pull` fetches it; MUSIZEER_IMAGES names another registry or owner (a fork). To build
# them from this checkout instead: docker-compose.build.yml.
x-images:
  app: &app-image ${MUSIZEER_IMAGES:-ghcr.io/sossiogll}/musizeer:${MUSIZEER_VERSION:-latest}
  gateway: &gateway-image ${MUSIZEER_IMAGES:-ghcr.io/sossiogll}/musizeer-gateway:${MUSIZEER_VERSION:-latest}
  frontend: &frontend-image ${MUSIZEER_IMAGES:-ghcr.io/sossiogll}/musizeer-frontend:${MUSIZEER_VERSION:-latest}

services:

  # ------------------------------------------------------------------
  # Init container: applies the database migrations and exits. app, the workers and beat
  # start only after it completed successfully. Before it migrates anything it backs the
  # database up into /data/backups (the last MUSIZEER_MIGRATION_BACKUPS_KEEP are kept; a failed backup
  # stops the migration; MUSIZEER_MIGRATION_BACKUP=off for whoever backs up otherwise: docs/migrations.md).
  # It does NOT scan the library any more: that
  # needs the providers, which the gateway starts only once the API has told it which are
  # installed, so the routine `import_existing_library` does it, once the storage provider
  # answers (docs/workers.md).
  # ------------------------------------------------------------------
  init:
    image: *app-image
    command: python -m scripts.init_db
    restart: "no"
    environment:
      <<: [*database, *credentials]
      MUSIZEER_DATA_DIR: /data # where the `data` volume below is mounted
      MUSIZEER_MIGRATION_BACKUP: ${MUSIZEER_MIGRATION_BACKUP:-}
      MUSIZEER_MIGRATION_BACKUPS_KEEP: ${MUSIZEER_MIGRATION_BACKUPS_KEEP:-}
      REDIS_URL: ${REDIS_URL:-}
    volumes:
      - data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ------------------------------------------------------------------
  # API FastAPI. Healthy when /health answers 200 AND says the database answers
  # ("db": "ok"): the frontend starts only then. The image is Python, so the check
  # needs no curl.
  # ------------------------------------------------------------------
  app:
    image: *app-image
    restart: unless-stopped
    environment:
      <<: [*database, *credentials, *public-urls, *application]
      MUSIZEER_DATA_DIR: /data
      REDIS_URL: ${REDIS_URL:-}
      MUSIZEER_AUTH_SECRET: ${MUSIZEER_AUTH_SECRET:?set MUSIZEER_AUTH_SECRET in .env (it was AUTH_SECRET)}
      MUSIZEER_ADMIN_BOOTSTRAP_EMAIL: ${MUSIZEER_ADMIN_BOOTSTRAP_EMAIL:-}
      MUSIZEER_ADMIN_BOOTSTRAP_PASSWORD: ${MUSIZEER_ADMIN_BOOTSTRAP_PASSWORD:-}
    volumes:
      - data:/data
      - downloads:/downloads
      - provider_sockets:/run/musizeer # the sockets of the providers the gateway runs
    depends_on: *backend-depends-on
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json, sys, urllib.request; reply = urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4); sys.exit(0 if reply.status == 200 and json.load(reply).get('db') == 'ok' else 1)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s

  # ------------------------------------------------------------------
  # Provider gateway — pulls provider images by digest and runs each one in a
  # bubblewrap sandbox with no network of its own (docs/gateway.md). It is the
  # only service that starts provider processes; `app` and the workers reach them
  # through the sockets in the shared `provider_sockets` volume.
  #
  # NEVER `privileged: true`; no capability, no published port. Privileged "works" only
  # because it also switches AppArmor and seccomp off, which hands the host to whatever
  # runs in the container. What the gateway does need, and why:
  #   - a seccomp profile: Docker's default plus the five syscalls bubblewrap
  #     builds a sandbox with (gateway/seccomp/musizeer-gateway.json, or the
  #     musizeer-gateway.seccomp.json that every release carries; MUSIZEER_GATEWAY_SECCOMP_PROFILE
  #     names the file);
  #   - apparmor=unconfined: Docker's docker-default AppArmor profile (Debian, Ubuntu...) denies
  #     the namespace calls with EACCES, which bubblewrap reports as "Creating new namespace
  #     failed: Permission denied". On a host without AppArmor it does nothing. Only this
  #     container loses the profile: it stays unprivileged, with every capability dropped and the
  #     seccomp profile above (docs/gateway.md, Troubleshooting, for a profile of its own);
  #   - systempaths=unconfined: a sandbox mounts its own /proc, which the kernel
  #     refuses while the container's /proc has Docker's masked paths over it.
  # The sandboxed processes get a further seccomp filter of their own that takes
  # those syscalls away again (gateway/musizeer_gateway/sandbox_filter.py).
  #
  # uid 1000 is the application's user (the `musizeer` user of the image): the
  # sockets and the workspace folders they share need no widening of permissions, and
  # the files a sandbox writes into the library belong to the same user as the application's.
  #
  # pids_limit caps the processes and threads of the whole container, the gateway and every
  # sandbox in it (the cgroup pids controller: only this container counts toward it). It is
  # what keeps a runaway provider from exhausting the host's process table. The gateway sets
  # no RLIMIT_NPROC on a sandbox: the kernel counts that over every process of the same uid on
  # the whole host (other containers included), so under uid 1000 it failed on a busy server.
  # Each sandbox is also held to the `limits.processes` of its manifest by the gateway itself
  # (docs/gateway.md, "Processes and threads"). MUSIZEER_GATEWAY_PIDS_LIMIT in .env changes the number.
  #
  # Which providers it runs: what the host pushes to it from its database (docs/gateway.md);
  # it runs nothing until it is told.
  # ------------------------------------------------------------------
  provider-gateway:
    image: *gateway-image
    user: "1000:1000"
    restart: unless-stopped
    pids_limit: ${MUSIZEER_GATEWAY_PIDS_LIMIT:-4096}
    cap_drop: [ALL]
    security_opt:
      - seccomp=${MUSIZEER_GATEWAY_SECCOMP_PROFILE:-./gateway/seccomp/musizeer-gateway.json}
      - apparmor=unconfined
      - systempaths=unconfined
    volumes:
      - provider_sockets:/run/musizeer
      - gateway_state:/var/lib/musizeer-gateway
      - downloads:/downloads # where the application downloads and works: shared with the application and the workers
      - library:/library # the library: mounted in the gateway only (the storage provider writes into it)
    # No folder is configured here (ADR-0008): the root folders (/downloads and /library are the conventional mounts)
    # and the working folder are declared in Administration > Root folders, and the host pushes them to the gateway.
    # What can be declared is bounded by what is mounted above: mount only the music folders.
    environment:
      # The ceilings of a sandbox: the most any provider may be given, whatever its manifest asks.
      MUSIZEER_GATEWAY_MAX_MEMORY_MB: ${MUSIZEER_GATEWAY_MAX_MEMORY_MB:-}
      MUSIZEER_GATEWAY_MAX_OPEN_FILES: ${MUSIZEER_GATEWAY_MAX_OPEN_FILES:-}
      MUSIZEER_GATEWAY_MAX_PROCESSES: ${MUSIZEER_GATEWAY_MAX_PROCESSES:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.socket(socket.AF_UNIX).connect('/run/musizeer/gateway.sock')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ------------------------------------------------------------------
  # Celery workers — uno per coda (vedi docs/workers.md), così un download
  # lento non fa mai aspettare i routine né i job chiesti da un utente.
  #
  # - worker:             coda "downloads" (concurrency dal setting
  #                       max_concurrent_downloads, letto all'avvio)
  # - worker-jobs:        coda "jobs" (sync dei mi piace, download dei mi
  #                       piace mancanti, verifica full-sync, import della
  #                       libreria esistente)
  # - worker-maintenance: coda "maintenance" (tick, routine, riconciliazioni);
  #                       "default" solo per svuotare i messaggi accodati
  #                       prima della separazione delle code.
  #
  # Una replica ciascuno: i reaper all'avvio (download e job rimasti
  # "in corso" dal processo precedente) contano su un solo processo per coda.
  # They start after the migrations, with the database, Redis and the gateway up.
  # ------------------------------------------------------------------
  worker:
    image: *app-image
    command: >
      celery -A workers.celery_app.celery worker
      --hostname=downloads@%h
      --loglevel=info
      --queues=downloads
    restart: unless-stopped
    environment: &worker-environment
      <<: [*database, *credentials, *application]
      MUSIZEER_DATA_DIR: /data
      REDIS_URL: ${REDIS_URL:-}
    volumes: &worker-volumes
      - data:/data
      - downloads:/downloads
      - provider_sockets:/run/musizeer
    depends_on: *backend-depends-on

  worker-jobs:
    image: *app-image
    command: >
      celery -A workers.celery_app.celery worker
      --hostname=jobs@%h
      --loglevel=info
      --queues=jobs
      --concurrency=2
    restart: unless-stopped
    environment: *worker-environment
    volumes: *worker-volumes
    depends_on: *backend-depends-on

  worker-maintenance:
    image: *app-image
    command: >
      celery -A workers.celery_app.celery worker
      --hostname=maintenance@%h
      --loglevel=info
      --queues=maintenance,default
      --concurrency=2
    restart: unless-stopped
    environment: *worker-environment
    volumes: *worker-volumes
    depends_on: *backend-depends-on

  # ------------------------------------------------------------------
  # Celery beat — pianifica i task periodici (sync libreria, sweep dei
  # download delegati) su Redis, cosi' i worker li eseguono.
  #
  # Servizio SEPARATO dai worker (a differenza di dev, che incorpora beat
  # nel worker-maintenance con -B): beat NON deve girare in più di
  # un'istanza (produrrebbe task duplicati a ogni tick) — un servizio
  # dedicato con replica=1 è l'unico modo di garantirlo indipendentemente da
  # quanti worker girano. Il tick finisce nella coda "maintenance". Legge lo stesso celery.conf.beat_schedule
  # costruito a livello di modulo in workers/celery_app.py (vedi il
  # commento lì: un cambio di intervallo ha effetto al prossimo riavvio di
  # QUESTO servizio, non a runtime).
  # ------------------------------------------------------------------
  beat:
    image: *app-image
    command: celery -A workers.celery_app.celery beat --schedule=/tmp/celerybeat-schedule --loglevel=info
    restart: unless-stopped
    environment:
      <<: [*database, *credentials]
      MUSIZEER_DATA_DIR: /data
      REDIS_URL: ${REDIS_URL:-}
    volumes:
      - data:/data
      - downloads:/downloads
    depends_on: *backend-depends-on

  # ------------------------------------------------------------------
  # Frontend — nginx that serves the static build and proxies /api/ to the API.
  # MUSIZEER_BACKEND_URL is where it reaches the API (default: the `app` service of this file); nginx
  # resolves the name again every few seconds (Docker's resolver, MUSIZEER_DNS_RESOLVER), so a recreated `app`
  # container is found. It starts when the API is healthy. docs/deployment.md.
  # ------------------------------------------------------------------
  frontend:
    image: *frontend-image
    restart: unless-stopped
    environment:
      MUSIZEER_BACKEND_URL: ${MUSIZEER_BACKEND_URL:-}
      MUSIZEER_DNS_RESOLVER: ${MUSIZEER_DNS_RESOLVER:-}
    ports:
      - "${MUSIZEER_PORT:-80}:80"
    depends_on:
      app:
        condition: service_healthy

  # ------------------------------------------------------------------
  # Redis — broker Celery + pub/sub per SSE
  # ------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ------------------------------------------------------------------
  # PostgreSQL — il database (docs/postgresql.md). La password viene da .env,
  # mai dal repository.
  # ------------------------------------------------------------------
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-musizeer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-musizeer}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  data:
  downloads:
  library:
  redis_data:
  postgres_data:
  provider_sockets:
  gateway_state:
