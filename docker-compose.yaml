# Il database di tutti i servizi: PostgreSQL (il servizio `postgres` qui sotto).
# POSTGRES_PASSWORD viene da .env (non versionato, vedi .env.example): una
# password sicura in un URL (lettere e cifre). Per restare su SQLite (file in
# DATA_DIR) si tolgono il servizio `postgres` e queste dipendenze: vedi
# docs/postgresql.md.
x-database: &database
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-musizerr}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-musizerr}

# The key that encrypts the stored credentials (docs/credentials.md). CREDENTIALS_KEY comes from
# .env (not versioned, see .env.example) and every service that reads the database needs it: the
# init container (its migration encrypts the existing credentials), the API, the workers and beat.
# CREDENTIALS_KEY_PREVIOUS holds the keys it replaced, while a rotation is in progress. The provider
# gateway never gets either: a provider receives the credential a call needs, never the key.
x-credentials: &credentials
  CREDENTIALS_KEY: ${CREDENTIALS_KEY:?set CREDENTIALS_KEY in .env (docs/credentials.md)}
  CREDENTIALS_KEY_PREVIOUS: ${CREDENTIALS_KEY_PREVIOUS:-}

# The images of Musizerr, published on GHCR for linux/amd64 and linux/arm64: every merge into master
# updates :latest, every release publishes :X.Y.Z. MUSIZERR_VERSION (in .env) pins a release and
# `docker compose pull` fetches it; MUSIZERR_IMAGES names another registry or owner (a fork). To build
# them from this checkout instead: docker-compose.build.yml.
x-images:
  app: &app-image ${MUSIZERR_IMAGES:-ghcr.io/sossiogll}/musizerr:${MUSIZERR_VERSION:-latest}
  gateway: &gateway-image ${MUSIZERR_IMAGES:-ghcr.io/sossiogll}/musizerr-gateway:${MUSIZERR_VERSION:-latest}
  frontend: &frontend-image ${MUSIZERR_IMAGES:-ghcr.io/sossiogll}/musizerr-frontend:${MUSIZERR_VERSION:-latest}

services:

  # ------------------------------------------------------------------
  # Init container: applica le migrazioni e, al primo avvio, indicizza la
  # libreria che lo storage provider configurato contiene già
  # ------------------------------------------------------------------
  init:
    image: *app-image
    command: python -m scripts.library_scan
    restart: "no"
    environment:
      <<: [*database, *credentials]
      DATA_DIR: /data
      REDIS_URL: redis://redis:6379/0
    volumes:
      - data:/data
      - downloads:/downloads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ------------------------------------------------------------------
  # API FastAPI
  # ------------------------------------------------------------------
  app:
    image: *app-image
    restart: unless-stopped
    environment:
      <<: [*database, *credentials]
      DATA_DIR: /data
      REDIS_URL: redis://redis:6379/0
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
    volumes:
      - data:/data
      - downloads:/downloads
      - provider_sockets:/run/musizerr # the sockets of the providers the gateway runs
    depends_on:
      init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # ------------------------------------------------------------------
  # Provider gateway — pulls provider images by digest and runs each one in a
  # bubblewrap sandbox with no network of its own (docs/gateway.md). It is the
  # only service that starts provider processes; `app` and the workers reach them
  # through the sockets in the shared `provider_sockets` volume.
  #
  # Not privileged, no capability, no published port. What it does need, and why:
  #   - a seccomp profile: Docker's default plus the five syscalls bubblewrap
  #     builds a sandbox with (gateway/seccomp/musizerr-gateway.json);
  #   - systempaths=unconfined: a sandbox mounts its own /proc, which the kernel
  #     refuses while the container's /proc has Docker's masked paths over it.
  # The sandboxed processes get a further seccomp filter of their own that takes
  # those syscalls away again (gateway/musizerr_gateway/sandbox_filter.py).
  #
  # uid 1000 is the application's user (the `musizerr` user of the image): the
  # sockets and the workspace folders they share need no widening of permissions.
  #
  # Which providers it runs: what the host pushes to it from its database (docs/gateway.md);
  # it runs nothing until it is told.
  # ------------------------------------------------------------------
  provider-gateway:
    image: *gateway-image
    user: "1000:1000"
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt:
      - seccomp=./gateway/seccomp/musizerr-gateway.json
      - systempaths=unconfined
    volumes:
      - provider_sockets:/run/musizerr
      - gateway_state:/var/lib/musizerr-gateway
      - downloads:/downloads # the workspaces live in the library volume, like the application's
    environment:
      # The folders a provider may be given a path inside of (filesystem_from_settings, docs/gateway.md): the library.
      GATEWAY_FILESYSTEM_ROOTS: /downloads
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.socket(socket.AF_UNIX).connect('/run/musizerr/gateway.sock')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ------------------------------------------------------------------
  # Celery workers — uno per coda (vedi docs/workers.md), così un download
  # lento non fa mai aspettare i routine né i job chiesti da un utente.
  #
  # - worker:             coda "downloads" (concurrency dal setting
  #                       max_concurrent_downloads, letto all'avvio)
  # - worker-jobs:        coda "jobs" (sync dei mi piace, download dei mi
  #                       piace mancanti, verifica full-sync)
  # - worker-maintenance: coda "maintenance" (tick, routine, riconciliazioni);
  #                       "default" solo per svuotare i messaggi accodati
  #                       prima della separazione delle code.
  #
  # Una replica ciascuno: i reaper all'avvio (download e job rimasti
  # "in corso" dal processo precedente) contano su un solo processo per coda.
  # ------------------------------------------------------------------
  worker:
    image: *app-image
    command: >
      celery -A workers.celery_app.celery worker
      --hostname=downloads@%h
      --loglevel=info
      --queues=downloads
    restart: unless-stopped
    environment: &worker-environment
      <<: [*database, *credentials]
      DATA_DIR: /data
      REDIS_URL: redis://redis:6379/0
    volumes: &worker-volumes
      - data:/data
      - downloads:/downloads
      - provider_sockets:/run/musizerr
    depends_on: &worker-depends-on
      init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker-jobs:
    image: *app-image
    command: >
      celery -A workers.celery_app.celery worker
      --hostname=jobs@%h
      --loglevel=info
      --queues=jobs
      --concurrency=2
    restart: unless-stopped
    environment: *worker-environment
    volumes: *worker-volumes
    depends_on: *worker-depends-on

  worker-maintenance:
    image: *app-image
    command: >
      celery -A workers.celery_app.celery worker
      --hostname=maintenance@%h
      --loglevel=info
      --queues=maintenance,default
      --concurrency=2
    restart: unless-stopped
    environment: *worker-environment
    volumes: *worker-volumes
    depends_on: *worker-depends-on

  # ------------------------------------------------------------------
  # Celery beat — pianifica i task periodici (sync libreria, sweep dei
  # download delegati) su Redis, cosi' i worker li eseguono.
  #
  # Servizio SEPARATO dai worker (a differenza di dev, che incorpora beat
  # nel worker-maintenance con -B): beat NON deve girare in più di
  # un'istanza (produrrebbe task duplicati a ogni tick) — un servizio
  # dedicato con replica=1 è l'unico modo di garantirlo indipendentemente da
  # quanti worker girano. Il tick finisce nella coda "maintenance". Legge lo stesso celery.conf.beat_schedule
  # costruito a livello di modulo in workers/celery_app.py (vedi il
  # commento lì: un cambio di intervallo ha effetto al prossimo riavvio di
  # QUESTO servizio, non a runtime).
  # ------------------------------------------------------------------
  beat:
    image: *app-image
    command: celery -A workers.celery_app.celery beat --schedule=/tmp/celerybeat-schedule --loglevel=info
    restart: unless-stopped
    environment:
      <<: [*database, *credentials]
      DATA_DIR: /data
      REDIS_URL: redis://redis:6379/0
    volumes:
      - data:/data
      - downloads:/downloads
    depends_on:
      init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # ------------------------------------------------------------------
  # Frontend — nginx che serve la build statica e proxia /api/ → app
  # ------------------------------------------------------------------
  frontend:
    image: *frontend-image
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    depends_on:
      - app

  # ------------------------------------------------------------------
  # Redis — broker Celery + pub/sub per SSE
  # ------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ------------------------------------------------------------------
  # PostgreSQL — il database (docs/postgresql.md). La password viene da .env,
  # mai dal repository.
  # ------------------------------------------------------------------
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-musizerr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-musizerr}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  data:
  downloads:
  redis_data:
  postgres_data:
  provider_sockets:
  gateway_state:
