# Build the images of Musizeer from this checkout instead of pulling the published ones
# (docker-compose.yaml): for a fork, or to run unreleased changes.
#
#   docker compose -f docker-compose.yaml -f docker-compose.build.yml up -d --build
#
# The local images are named musizeer:local, musizeer-gateway:local and musizeer-frontend:local, so they
# never stand in for a pulled release.
name: musizeer

x-app-build: &app-build
  image: musizeer:local
  build:
    context: .
    target: production

services:
  init: *app-build
  app: *app-build
  worker: *app-build
  worker-jobs: *app-build
  worker-maintenance: *app-build
  beat: *app-build
  provider-gateway:
    image: musizeer-gateway:local
    build:
      context: .
      dockerfile: gateway/Dockerfile
      target: production
  frontend:
    image: musizeer-frontend:local
    build:
      context: musizeer-ui
      target: production
