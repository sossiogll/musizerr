name: labels

# Every pull request into dev carries exactly one release label (ADR-0007 §6): breaking (a MAJOR), feature
# (a MINOR), fix (a PATCH) or chore (no release). The release of a merge into master is computed from them.
on:
  pull_request:
    branches: [dev]
    types: [opened, reopened, synchronize, labeled, unlabeled, edited]

permissions:
  contents: read

jobs:
  release-label:
    name: release label
    runs-on: ubuntu-latest
    steps:
      - name: exactly one of breaking, feature, fix, chore
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          found=$(echo "$LABELS" | jq -r '[.[] | select(. == "breaking" or . == "feature" or . == "fix" or . == "chore")] | join(", ")')
          count=$(echo "$LABELS" | jq '[.[] | select(. == "breaking" or . == "feature" or . == "fix" or . == "chore")] | length')
          if [ "$count" -ne 1 ]; then
            echo "::error::a pull request into dev needs exactly one release label: breaking, feature, fix or chore (it has: ${found:-none})"
            exit 1
          fi
          echo "release label: $found"
