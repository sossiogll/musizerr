name: images

# A merge into master rebuilds the images of Musizerr and pushes them to GHCR for linux/amd64 and
# linux/arm64: :latest and :<commit>. The provider base image is pushed as :<contract> and :<SDK version>
# (scripts/publish-provider-base.sh does the same from a machine).
#
# A version tag (v1.2.3, pushed on a commit of master) pushes the images as :1.2.3 and :<commit> and
# creates the GitHub release of that tag, its notes generated from the pull requests merged since the
# previous one.
on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency: images-${{ github.ref }}

jobs:
  image:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: musizerr
            context: .
            file: Dockerfile
            target: production
            description: "Musizerr: the API, the workers and the database migrations."
          - image: musizerr-frontend
            context: musizerr-ui
            file: musizerr-ui/Dockerfile
            target: production
            description: "Musizerr: the web app, served by nginx."
          - image: musizerr-gateway
            context: .
            file: gateway/Dockerfile
            target: production
            description: "Musizerr: the provider gateway, which runs every provider in a sandbox."
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the tags: the version of a build of master counts from the last one
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: the image's name and channel
        shell: bash
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image }}" >> "$GITHUB_ENV"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "CHANNEL=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
            echo "MUSIZERR_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            # A build of master: the last release plus how far after it (ADR-0007 §2), "1.3.2+7.abc1234".
            last=$(git describe --tags --abbrev=0 --match "v[0-9]*" 2>/dev/null || true)
            if [ -n "$last" ]; then ahead=$(git rev-list --count "$last..HEAD"); else last=v0.0.0; ahead=$(git rev-list --count HEAD); fi
            echo "CHANNEL=latest" >> "$GITHUB_ENV"
            echo "MUSIZERR_VERSION=${last#v}+${ahead}.${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            MUSIZERR_VERSION=${{ env.MUSIZERR_VERSION }}
            MUSIZERR_COMMIT=${{ github.sha }}
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.IMAGE }}:${{ env.CHANNEL }}
            ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
            org.opencontainers.image.description=${{ matrix.description }}
          # GHCR reads the repository, the description and the license of a multi-platform image from its index.
          annotations: |
            index:org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            index:org.opencontainers.image.description=${{ matrix.description }}
            index:org.opencontainers.image.licenses=AGPL-3.0-or-later
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  provider-base:
    name: musizerr-provider-base
    # Versioned by the SDK, not by the tags of Musizerr.
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: publish the base image of the providers
        run: GHCR_NAMESPACE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" scripts/publish-provider-base.sh
        shell: bash

  release:
    name: release
    if: github.ref_type == 'tag'
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: the release of the tag, with its images and release.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          version=${GITHUB_REF_NAME#v}
          owner=${GITHUB_REPOSITORY_OWNER,,}
          # What an instance's update check reads (ADR-0007 §5.1, services/update_check.py): the provider
          # contracts this version runs and the digests of its images. The contract migrations and the
          # manual steps join it with phases 3 and 4 of the ADR; until then the notes say them.
          contract=$(sed -n 's/^PROVIDER_API_VERSION = \([0-9][0-9]*\)$/\1/p' sdk/src/musizerr_sdk/interfaces.py)
          images='{}'
          {
            echo "## Images"
            echo
            for image in musizerr musizerr-frontend musizerr-gateway; do
              digest=$(docker buildx imagetools inspect "ghcr.io/$owner/$image:$version" --format '{{json .Manifest}}' | jq -r .digest)
              images=$(jq -c --arg name "$image" --arg ref "ghcr.io/$owner/$image@$digest" '. + {($name): $ref}' <<<"$images")
              echo "- \`ghcr.io/$owner/$image:$version\` (\`$digest\`)"
            done
          } > "$RUNNER_TEMP/notes.md"
          jq -n --arg version "$version" --argjson contract "$contract" --argjson images "$images" \
            '{version: $version, provider_contracts: [$contract], images: $images}' > "$RUNNER_TEMP/release.json"
          cat "$RUNNER_TEMP/release.json"
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Musizerr $version" \
            --notes-file "$RUNNER_TEMP/notes.md" --generate-notes "$RUNNER_TEMP/release.json"
