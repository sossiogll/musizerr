name: ci

# Every pull request runs the whole suite; master takes pull requests from dev only (branch protection
# requires these checks). A push to dev runs it too, so dev is known green before its pull request.
on:
  pull_request:
    branches: [master, dev]
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-branch:
    name: master takes dev only
    # Only where the dev/master flow lives: the public repository. The private one merges feature branches.
    if: github.event_name == 'pull_request' && github.base_ref == 'master' && !github.event.repository.private
    runs-on: ubuntu-latest
    steps:
      - name: the pull request comes from dev of this repository
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ "$HEAD_REF" != dev ] || [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::master takes pull requests from dev only (this one is from $HEAD_REPO:$HEAD_REF)"
            exit 1
          fi

  backend-sqlite:
    name: backend (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
      - run: pip install -q -r requirements-dev.txt -e sdk
      - run: python -m pytest -p no:cacheprovider
        working-directory: app
        env:
          AUTH_SECRET: test-secret
          DATA_DIR: ${{ runner.temp }}/data

  backend-postgresql:
    name: backend (PostgreSQL ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
      # pg_dump and pg_restore for the backup tests (test_database_guard, test_restore_backup): the client must be of the
      # server's major (17, as the image's postgresql-client-17), and the runner's own apt has 16, which pg_dump refuses
      # a newer server with. From the PostgreSQL project's apt repository (PGDG), its key checked against the published
      # fingerprint, and put first on PATH (the runner has other majors installed).
      - name: PostgreSQL 17 client
        run: |
          set -euo pipefail
          key=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o "$key" https://www.postgresql.org/media/keys/ACCC4CF8.asc
          gpg --show-keys --with-colons "$key" | grep -q '^fpr:::::::::B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8:'
          echo "deb [signed-by=$key] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends postgresql-client-17
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"
      - run: pg_dump --version
      - run: pip install -q -r requirements-dev.txt -e sdk
      # One database per test makes this suite slow: four runners take a quarter of the test files each.
      - name: the shard's test files
        working-directory: app
        run: |
          ls tests/test_*.py | sort | awk -v n=4 -v i=${{ matrix.shard }} 'NR % n == i' > "$RUNNER_TEMP/shard.txt"
          wc -l < "$RUNNER_TEMP/shard.txt"
      - run: python -m pytest -p no:cacheprovider $(cat "$RUNNER_TEMP/shard.txt")
        working-directory: app
        env:
          AUTH_SECRET: test-secret
          DATA_DIR: ${{ runner.temp }}/data
          TEST_DATABASE_URL: postgresql+psycopg://postgres:test@localhost:5432/postgres

  sdk:
    name: SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -q -e sdk pytest==8.3.4 hypothesis==6.122.3
      - run: python -m pytest -p no:cacheprovider tests
        working-directory: sdk

  gateway:
    name: gateway
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -q -e sdk -e gateway pytest==8.3.4 hypothesis==6.122.3
      - run: python -m pytest -p no:cacheprovider tests
        working-directory: gateway

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: musizeer-ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # The root tsconfig.json analyses nothing (project references): check the app's own.
      - run: npx tsc -p tsconfig.app.json --noEmit
      - run: pnpm test

  frontend-image:
    name: frontend image (nginx proxy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Builds the production image, runs it against throwaway upstreams: the /api rewrite, the unbuffered progress stream,
      # a backend that is recreated or renamed (BACKEND_URL), nginx -t.
      - run: scripts/test-frontend-image.sh

  compose:
    name: compose files
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci
      AUTH_SECRET: ci-secret-of-at-least-thirty-two-characters
      CREDENTIALS_KEY: 3ER8zf6Vc8gFp5cbk2OqSEx_sA1KfLVT3q0ByU7bFHQ=
    steps:
      - uses: actions/checkout@v7
      - name: the files render
        run: |
          docker compose -f docker-compose.yaml config -q
          docker compose -f docker-compose.yaml -f docker-compose.build.yml config -q
          docker compose -f docker-compose.dev.yml config -q
      - name: the gateway is never privileged and is not left to AppArmor's default, in any compose file
        run: |
          for file in docker-compose.yaml docker-compose.dev.yml; do
            docker compose -f "$file" config --format json | jq -e '.services["provider-gateway"] | (.privileged // false) == false and (.cap_drop | index("ALL")) != null and (.security_opt | index("apparmor=unconfined")) != null' > /dev/null \
              || { echo "::error::$file: provider-gateway must keep cap_drop ALL, apparmor=unconfined and never be privileged"; exit 1; }
          done
      - name: the release assets are built
        run: |
          scripts/package-release-assets.sh "$RUNNER_TEMP/assets"
          cd "$RUNNER_TEMP/assets" && docker compose config --format json | jq -e '.services["provider-gateway"].security_opt | index("seccomp=./musizeer-gateway.seccomp.json")' > /dev/null
