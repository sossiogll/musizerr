server {
    listen 80;
    server_name _;

    # ------------------------------------------------------------------
    # Frontend — file statici buildati da pnpm
    # ------------------------------------------------------------------
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;  # SPA fallback
    }

    # ------------------------------------------------------------------
    # API backend — proxy verso FastAPI
    # ------------------------------------------------------------------
    location /api/ {
        proxy_pass         http://app:8000/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # ------------------------------------------------------------------
    # SSE endpoint — disabilita buffering per streaming real-time
    # ------------------------------------------------------------------
    location /api/progress {
        proxy_pass             http://app:8000/progress;
        proxy_set_header       Host $host;
        proxy_set_header       Connection '';
        proxy_http_version     1.1;
        proxy_buffering        off;
        proxy_cache            off;
        proxy_read_timeout     3600s;  # connessione SSE lunga
        chunked_transfer_encoding on;
    }
}
