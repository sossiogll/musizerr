# Used by scripts/test-provider-infra-integration.sh on top of docker-compose.dev.yml, under the compose project
# `mzp51`: nothing published on a port the real stack uses (the local registry on 127.0.0.1:18700 only), the library is
# a throwaway volume, the catalog server serves the test's own folder, and a tiny FTP server stands in for a file server.
services:
  provider-gateway:
    volumes: !override
      - ./gateway:/gateway
      - ./sdk:/sdk
      - provider_sockets:/run/musizerr
      - gateway_state:/var/lib/musizerr-gateway
      - downloads:/downloads
    environment:
      # something a provider must never see, to look for it from inside
      GATEWAY_CANARY: infra-should-never-see-this
  oci-registry:
    ports: !override
      - "127.0.0.1:18700:5000"
  registry:
    ports: !reset []
    volumes: !override
      - ${MZP51_CATALOG_DIR}:/srv:ro
  redis:
    ports: !reset []
  ftp-fake:
    image: python:3.12-slim
    volumes:
      - ./gateway/tests/integration/fake_ftp.py:/fake_ftp.py:ro
    command: python /fake_ftp.py
    networks:
      default:
        aliases: [ftp-fake-ctl] # a second name for the same server: a host named by the setting that allows the control port only

volumes:
  downloads:
